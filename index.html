            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
            /* This tells mobile browsers to fill the whole screen including the notch area */
            padding-bottom: env(safe-area-inset-bottom);
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            box-sizing: border-box;
            /* This ensures your game doesn't get covered by the home indicator bar */
            padding-bottom: env(safe-area-inset-bottom);

            /* Disable text selection and copying */
            -webkit-user-select: none;
            user-select: none;

            /* Disable the iOS long-press callout bubble/menu */
            -webkit-touch-callout: none;

            /* Disable the flash/highlight effect when you tap */
            -webkit-tap-highlight-color: transparent;



        }

        let TARGET_ALT_Y, ship, booster, terrain = [], pads = [], launchPad = {}, smokeTrail = [], stars = [], legacySats = [], backgroundObjects = [], craters = [], satellites = [];

        let gameOver = false, separated = false, totalDeployed = 0, doorOpen = false, satInventory = 50, lastTime = performance.now(), missionStart = lastTime; demoEnabled = false;
        let demoPhase = 'launch', lastDeployTime = 0, instructionsStartTime = null, animationId = null, pulseAngle = 0, cosmeticObjPulse = 0, splashActive = true;
        let rotKeyHeldTime = 0, timeSinceGameOver = 0, audioCtx = null, engineOsc = null, engineGain = null;

            'ArrowUp': false, 'ArrowLeft': false, 'ArrowRight': false,
            'KeyS': false, 'KeyD': false, 'KeyA': false
        };
        const pointerActionMap = new Map();

        const touchMap = new Map();

        // --- THREE-BODY PROBLEM BACKGROUND SETUP ---
        let threeBodyTime = 0;
        const threeBodySystem = {
            centerX: 1920 * 0.1, // Shifted slightly right for optimal sky visibility
            centerY: 1220 * 0.1,
            scale: 50,           // Increased scale so the loops are wide and dramatic

            ]
        };

        const alienImg = new Image(); alienImg.src = 'alien.png';

        // Trackers for Alien System
        let alienShip = { x: 0, y: 0, width: 80, height: 50, speed: 150, direction: 1, active: false, nextSpawnTime: performance.now() + 8000, shootTimer: 0 };
        let alienLasers = [];
        let radarBullets = [];
        const uiState = { timer: "T+ 00:00", milestone: "OFFLINE", payloadText: "READY", payloadInZone: false, satCount: 0, mbps: 0, gameLevel: 0 };



        // function resetGame() {
        //     const startX = (launchPad.x1 + launchPad.x2) / 2, boosterY = launchPad.y - 25, shipY = boosterY - 44;
        //     ship = { id: 'Ship', x: startX, y: shipY, xv: 0, yv: 0, width: 20, height: 60, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: false, landed: false, crashed: false, exploded: false, color: '#00a8a8' };
        //     booster = { id: 'Booster', x: startX, y: boosterY, xv: 0, yv: 0, width: 30, height: 50, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: false, landed: false, config: 'standard', crashed: false, exploded: false, color: '#b0b0b0', legsVisible: true };

        //     demoPhase = 'launch'; separated = false; doorOpen = false; satInventory = 50; lastDeployTime = 0; msgBox.style.display = 'none'; missionStart = performance.now(); smokeTrail = []; generateCosmeticObjects();
        // }


        function resetGame() {
            const startX = (launchPad.x1 + launchPad.x2) / 2, boosterY = launchPad.y - 25, shipY = boosterY - 44;

            // Reset ships with full properties
            ship = { id: 'Ship', x: startX, y: shipY, xv: 0, yv: 0, width: 20, height: 60, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: false, landed: false, crashed: false, exploded: false, color: '#00a8a8' };

            // EXPLICITLY RESET CONFIGURATION
            booster = {
                id: 'Booster', x: startX, y: boosterY, xv: 0, yv: 0, width: 30, height: 50,
                angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: false,
                landed: false, config: 'standard', // <--- Ensure this is always 'standard' on reset
                crashed: false, exploded: false, color: '#b0b0b0', legsVisible: true
            };

            // Reset game state variables
            demoPhase = 'launch';
            separated = false;
            doorOpen = false;
            satInventory = 50;
            lastDeployTime = 0;
            msgBox.style.display = 'none';
            missionStart = performance.now();
            smokeTrail = [];
            generateCosmeticObjects();
            stopWacaWaca();

            alienShip.active = false;
            alienShip.nextSpawnTime = performance.now() + 8000 + (Math.random() * 5000); // Reset the spawn timer
            alienLasers = [];
            radarBullets = [];
        }



        function initAudio() {
            if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
            // Music
            audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume();
            if (!bgMusic) { bgMusic = new Audio('gameMusic.mp3'); bgMusic.loop = true; bgMusic.volume = 0.4; }
            engineOsc = audioCtx.createOscillator(); engineGain = audioCtx.createGain(); engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0, audioCtx.currentTime); engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination); engineOsc.start();
        }

        function playSound(type) {
            if (!audioCtx) return; const now = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
            if (type === 'deploy') { o.type = 'triangle'; o.frequency.setValueAtTime(440, now); o.frequency.exponentialRampToValueAtTime(880, now + 0.1); g.gain.setValueAtTime(0.05, now); g.gain.linearRampToValueAtTime(0, now + 0.1); o.start(); o.stop(now + 0.1); }
            else if (type === 'sep') { o.type = 'sawtooth'; o.frequency.setValueAtTime(110, now); g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0, now + 0.2); o.start(); o.stop(now + 0.2); }
            else if (type === 'crash') { o.type = 'sawtooth'; o.frequency.setValueAtTime(60, now); o.frequency.exponentialRampToValueAtTime(30, now + 0.8); g.gain.setValueAtTime(0.3, now); g.gain.linearRampToValueAtTime(0, now + 0.8); o.start(); o.stop(now + 0.8); }
            else if (type === 'success') {
                [523, 659, 783, 1046].forEach((f, i) => { const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain(); o2.type = 'square'; o2.connect(g2); g2.connect(audioCtx.destination); o2.frequency.setValueAtTime(f, now + i * 0.1); g2.gain.setValueAtTime(0.04, now + i * 0.1); g2.gain.linearRampToValueAtTime(0, now + i * 0.1 + 0.2); o2.start(now + i * 0.1); o2.stop(now + i * 0.1 + 0.2); });
            }
            else if (type === 'build') {
                // Base low impact thud
                o.type = 'square';
                o.frequency.setValueAtTime(90, now);
                o.frequency.exponentialRampToValueAtTime(40, now + 0.4);
                g.gain.setValueAtTime(0.25, now);
                g.gain.linearRampToValueAtTime(0, now + 0.4);
                o.start(); o.stop(now + 0.4);

                // Futuristic construction layer
                const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
                o2.type = 'triangle'; o2.connect(g2); g2.connect(audioCtx.destination);
                o2.frequency.setValueAtTime(180, now);
                o2.frequency.exponentialRampToValueAtTime(360, now + 0.25);
                g2.gain.setValueAtTime(0.15, now);
                g2.gain.linearRampToValueAtTime(0, now + 0.25);
                o2.start(); o2.stop(now + 0.25);
            }
            else if (type === 'laserHit') {
                // A quick, sharp sizzle/thud for the ground impact
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(300, now);
                o.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                g.gain.setValueAtTime(0.2, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                o.start(); o.stop(now + 0.15);
            }

        }


        // NEW: Global tracker for the alien engine sound
        let wacaOscillator = null;

        function playWacaWaca(duration = 1.5) {
            if (!audioCtx) return;

            // If one is already playing, stop it before starting a new one
            stopWacaWaca();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // Track it globally so we can kill it later
            wacaOscillator = osc;

            osc.type = 'square';
            const speed = 0.14;
            const totalSteps = Math.floor(duration / speed);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            for (let i = 0; i < totalSteps; i++) {
                const stepTime = now + (i * speed);
                const frequency = (i % 2 === 0) ? 523 : 880;
                osc.frequency.setValueAtTime(frequency, stepTime);
                osc.frequency.linearRampToValueAtTime(frequency === 523 ? 650 : 400, stepTime + speed * 0.7);
                gainNode.gain.setValueAtTime(0.05, stepTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, stepTime + speed * 0.92);
            }

            osc.start(now);
            osc.stop(now + duration);

            // Clean up the reference when it finishes naturally
            osc.onended = () => {
                if (wacaOscillator === osc) wacaOscillator = null;
            };
        }

        // NEW: Helper function to kill the sound instantly
        function stopWacaWaca() {
            if (wacaOscillator) {
                try {
                    wacaOscillator.stop();
                    wacaOscillator.disconnect();
                } catch (e) { } // Catch error if it already stopped
                wacaOscillator = null;
            }
        }

        function setEngineVolume(vol) { if (engineGain) engineGain.gain.setTargetAtTime(vol * 0.05, audioCtx.currentTime, 0.05); }

        async function triggerSplashScreen() {
            splashActive = true; splashDiv.style.opacity = "1"; setTimeout(() => { if (splashImg) splashImg.style.opacity = "1"; }, 100);
            playIntroSong(); setTimeout(() => { splashDiv.style.opacity = "0"; setTimeout(() => { splashDiv.style.display = 'none'; splashActive = false; missionStart = performance.now(); instructionsStartTime = performance.now(); if (bgMusic) bgMusic.play(); }, 1500); }, 4000);
        }

        // function init(keepAutopilot = false, isReset = false) {


        function init(keepAutopilot = false, isReset = false, keepDemo = false) {

            if (animationId) cancelAnimationFrame(animationId);

            // If not keeping demo, force it off. 
            // If we are doing a manual reset, we probably want to keep the current setting.
            if (!keepDemo) demoEnabled = false;
            stopWacaWaca();
            width = virtualWidth; height = virtualPlayHeight; TARGET_ALT_Y = height * 0.25;
            demoPhase = 'launch';
            gameOver = false; separated = false; totalDeployed = 0; doorOpen = false; satInventory = 50; timeSinceGameOver = 0; if (!isReset) { satellites = []; splashActive = true; } else { splashActive = false; }
            instructionsStartTime = null; msgBox.style.display = 'none'; const now = performance.now(); lastTime = now; missionStart = now; smokeTrail = []; legacySats = []; backgroundObjects = []; rotKeyHeldTime = 0; cosmeticObjPulse = 0;
            generateTerrain();
            generateCosmeticObjects();
            const startX = (launchPad.x1 + launchPad.x2) / 2, boosterY = launchPad.y - 25, shipY = boosterY - 44;
            ship = { id: 'Ship', x: startX, y: shipY, xv: 0, yv: 0, width: 20, height: 60, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: keepAutopilot, landed: false, crashed: false, exploded: false, color: '#007878' };
            booster = { id: 'Booster', x: startX, y: boosterY, xv: 0, yv: 0, width: 30, height: 50, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: keepAutopilot, landed: false, config: 'standard', crashed: false, exploded: false, color: '#808080', legsVisible: true };
            stars = []; for (let i = 0; i < 150; i++) stars.push({ x: Math.random() * width, y: Math.random() * (height * 0.66), size: Math.random() * 1.5, opacity: Math.random() });
            for (let i = 0; i < 20; i++) legacySats.push({ x: Math.random() * width, y: TARGET_ALT_Y + (Math.random() - 0.5) * (ALT_ENVELOPE * 3), vx: 35 + Math.random() * 25, vy: (Math.random() - 0.5) * 10, size: 3, opacity: 0.2 + Math.random() * 0.3 });
            if (!isReset) triggerSplashScreen(); else { splashDiv.style.display = 'none'; instructionsStartTime = performance.now(); }
            lastTime = performance.now(); animationId = requestAnimationFrame(update);
        }

        function generateTerrain() {
            terrain = []; pads = []; const points = 220, spacing = width / points, seed = Math.random() * 1000;
            const getTerrainHeight = (x) => { const h1 = Math.sin(x * 0.003 + seed) * 50, h2 = Math.sin(x * 0.01 + seed * 1.5) * 20, h3 = Math.sin(x * 0.025 + seed * 2) * 5; return height - (250 + h1 + h2 + h3); };
            const lpS = 10, lpE = 25, lpY = getTerrainHeight(lpS * spacing); launchPad = { x1: lpS * spacing, x2: lpE * spacing, y: lpY };
            const p1S = Math.floor(points * (0.35 + Math.random() * 0.20)), p2S = Math.floor(points * (0.60 + Math.random() * 0.25)), pW = 7;
            for (let i = 0; i <= points; i++) {
                let tx = i * spacing, ty; if (i >= lpS && i <= lpE) ty = lpY;
                else if (i >= p1S && i <= p1S + pW) { ty = getTerrainHeight(p1S * spacing); if (i === p1S) pads.push({ x1: tx, x2: tx + (pW * spacing), y: ty, owner: 'Booster' }); }
                else if (i >= p2S && i <= p2S + pW) { ty = getTerrainHeight(p2S * spacing); if (i === p2S) pads.push({ x1: tx, x2: tx + (pW * spacing), y: ty, owner: 'Ship' }); }
                else ty = getTerrainHeight(tx); terrain.push({ x: tx, y: ty });
            }
            craters = []; for (let i = 0; i < 10; i++) {
                const x = Math.random() * width, gP = terrain.find(p => p.x > x) || terrain[terrain.length - 1];
                craters.push({ x: x, y: gP.y + 15 + Math.random() * 80, radiusX: 10 + Math.random() * 40, radiusY: 4 + Math.random() * 12, alpha: 0.1 + Math.random() * 0.2 });
            }
        }

        function generateCosmeticObjects() {


            backgroundObjects = [];

            // Spacemen
            for (let i = 0; i < uiState.gameLevel; i++) {
                backgroundObjects.push({
                    type: 'Spaceman',
                    x: Math.random() * width,
                    y: 0, // Gets overridden by terrain tracking
                    size: 0.4 + Math.random() * 0.4,
                    speed: 15 + Math.random() * 20,
                    direction: Math.random() > 0.5 ? 1 : -1,
                    alpha: 1.0,
                    angle: 0,
                    isGrounded: true, // Forces them to track terrain Y
                    bouncePhase: Math.random() * Math.PI * 2,
                    bounceSpeed: 3 + Math.random() * 4,
                    bounceHeight: 20 + Math.random() * 60,
                    perspectiveOffset: (Math.random() - 0.3) * 60 // Creates the foreground/background illusion
                });
            }

            // Eagles
            if (uiState.gameLevel > 1) { for (let i = 0; i < uiState.gameLevel; i++) backgroundObjects.push({ type: 'Eagle', x: Math.random() * width, y: height - 400 - Math.random() * 100, size: 0.2 + Math.random() * 0.2, speed: 25 + Math.random() * 15, direction: Math.random() > 0.5 ? 1 : -1, alpha: 0.8, tilt: 0, isGrounded: false }); }

            // Buggies
            if (uiState.gameLevel >= 1) { for (let i = 0; i < (uiState.gameLevel * 2) + 1; i++) backgroundObjects.push({ type: 'Buggy', x: (width * 0.1) + Math.random() * (width * 0.8), y: 0, size: 1, speed: 6 + Math.random() * 4, direction: Math.random() > 0.5 ? 1 : -1, alpha: 0.8, angle: 0, isGrounded: true }); }

            // Radar Stations
            if (uiState.gameLevel >= 2) { const mPX = ((pads[0].x1 + pads[0].x2) / 2 + (pads[1].x1 + pads[1].x2) / 2) / 2; backgroundObjects.push({ type: 'Radar', x: mPX, y: 0, size: 1.25, speed: 0, direction: 1, alpha: 0.8, angle: 0, isGrounded: true }); }

            // Ground Terra Form Stations
            if (uiState.gameLevel >= 0) {
                for (let i = 0; i < uiState.gameLevel; i++) {
                    backgroundObjects.push({
                        type: 'Terraform',
                        x: width * 0.92,
                        y: 0, // logic handles Y height
                        size: 0.8,
                        speed: 0,
                        direction: 1,
                        alpha: 1.0,
                        angle: 0,
                        isGrounded: true
                    });
                }
            }

            // Space Solar Arrays
            if (uiState.gameLevel >= 3) {
                for (let i = 0; i < uiState.gameLevel; i++) {
                    backgroundObjects.push({
                        type: 'SpaceArray',
                        x: Math.random() * width,
                        y: (height / 18) - Math.random() * 10,
                        //x: width / 2,
                        //y: height / 18,
                        size: 0.7 + Math.random() * 0.25,
                        speed: 15,
                        direction: 1,
                        alpha: 1.0,
                        angle: 10,
                        deployed: 0,
                        isGrounded: false,
                        isBeaming: true
                    });
                }
            }

            // Harvester
            if (uiState.gameLevel >= 1) {
                backgroundObjects.push({
                    type: 'Harvester',
                    x: width * Math.random(), // Stationed in the central mining flats
                    y: height * 0.9,
                    size: 0.5,
                    speed: 10, // Slow crawling speed
                    direction: 1,
                    alpha: 1.0,
                    angle: 0,
                    isGrounded: false,
                    ringRotation: 0 // Track its own internal spinning mechanism
                });
            }

            // Clouds
            for (let i = 0; i < o2Level / 10; i++) {
                backgroundObjects.push({
                    type: 'Cloud',
                    // Random horizontal start position so they don't all clump up
                    x: Math.random() * width,
                    // Fixed heights: spaced out between 5% and 25% of the screen height
                    y: (height / 2.5) + (i * (height / 90)),
                    size: 0.4 + Math.random() * 0.5,
                    // Base speed of 8 + a random variance so they move "randomly" but always right
                    speed: 8 + (Math.random() * 12),
                    direction: 1, // Same general direction
                    alpha: 0.1 + (Math.random() * 0.1), // Some more transparent than others
                    angle: 0,
                    isGrounded: false,
                    isBeaming: false
                });
            }

            // Farming Plots
            if (uiState.gameLevel >= 0) {
                for (let i = 0; i < 30; i++) {
                    backgroundObjects.push({
                        type: 'Farm',
                        x: (width * 0.2) + (i * 200) + Math.random() * 100,
                        y: height * 0.9 + Math.random() * 50,
                        size: 0.2,
                        speed: 0,
                        direction: 1,
                        alpha: 1.0,
                        angle: 0,
                        isGrounded: false
                    });
                }
            }

            // Trucks
            // if (uiState.gameLevel >= 0) {
            if (o2Level > 90) {
                // Spawns 2 cargo trucks cruising across the crater plains
                for (let i = 0; i < 2; i++) {
                    backgroundObjects.push({
                        type: 'LunarSemi',
                        x: width * (0.15 + i * 0.5) + Math.random() * 150,
                        y: height * .95,
                        size: 0.5,
                        speed: 100 + Math.random() * 6, // Noticeably faster than the harvester
                        direction: Math.random() > 0.5 ? 1 : -1,
                        alpha: 1.0,
                        angle: 0,
                        isGrounded: false,
                        bounceTimer: Math.random() * Math.PI // Used for a subtle cabin suspension bounce effect
                    });
                }
            }

            // Bio Station
            if (o2Level > 50) {
                backgroundObjects.push({
                    type: 'BioStation',
                    x: Math.random() * width,
                    y: height * 0.9,
                    size: .75,
                    alpha: 1.0,
                    isGrounded: false,
                    speed: 0,
                    direction: 1
                });
            }

        }


        function deploySatellites() {
            if (gameOver || satInventory <= 0 || splashActive) return;
            if (satellites.length >= 300) { satInventory = 0; uiState.milestone = "CONSTELLATION AT CAPACITY"; return; }
            playSound('deploy'); doorOpen = true; satInventory -= 10; totalDeployed += 10;
            for (let i = 0; i < 10; i++) satellites.push({
                x: ship.x, y: ship.y, vx: ship.xv + (Math.random() - 0.5) * 2, vy: ship.yv + (Math.random() - 0.5) * 2,
                size: 4, opacity: 1.0, heat: 0, vaporizeAlt: height - (300 + Math.random() * 150),
                activated: false, activationTimer: 0, flicker: false
            });

        function drawThreeBody(vCtx) {

            if (splashActive) return;

            // 1. Draw the massive overlapping gravity loop paths
            threeBodySystem.suns.forEach(sun => {
                if (sun.trail.length < 2) return;
                vCtx.save();
                vCtx.beginPath();
                vCtx.moveTo(sun.trail[0].x, sun.trail[0].y);
                for (let i = 1; i < sun.trail.length; i++) {
                    vCtx.lineTo(sun.trail[i].x, sun.trail[i].y);
                }
                vCtx.strokeStyle = sun.color;
                vCtx.globalAlpha = 0.15; // Elegant background trace line
                vCtx.lineWidth = 3;
                vCtx.stroke();
                vCtx.restore();
            });

            // 2. Draw the three glowing Suns (Now faded and soft)
            threeBodySystem.suns.forEach(sun => {
                if (sun.x === 0 || !isFinite(sun.x)) return;

                vCtx.save();

                const skyProgress = o2Level / 100;
                // LOWERED OPACITY: Dropped the baseline from 0.7 down to 0.35 max transparency
                vCtx.globalAlpha = Math.max(0.08, 0.6 - (skyProgress * 0.25));

                // Radiant muted glow layer
                const gradient = vCtx.createRadialGradient(sun.x, sun.y, 1, sun.x, sun.y, sun.r * 5);
                gradient.addColorStop(0, sun.glow);
                gradient.addColorStop(0.5, sun.glow);
                gradient.addColorStop(1, 'transparent');

                vCtx.fillStyle = gradient;
                vCtx.beginPath();
                vCtx.arc(sun.x, sun.y, sun.r * 5, 0, Math.PI * 2);
                vCtx.fill();

                // SOFT INNER CORE: Changed from solid bright cream/white 
                // to a slightly transparent version of the sun's own base color
                vCtx.fillStyle = sun.color;
                vCtx.globalAlpha *= 0.6; // Extra dimming layer just for the center core
                vCtx.beginPath();
                vCtx.arc(sun.x, sun.y, sun.r * 0.6, 0, Math.PI * 2);
                vCtx.fill();

                vCtx.restore();
            });
        }

                        playSound('sep');
                        separated = true;
                        booster.autopilot = true;

                        booster.yv += 22;
                        ship.yv -= 10;
                    }
                    demoPhase = 'vertical_insertion';
                }
            }

            // --- PHASE 2: VERTICAL INSERTION ---
            else if (demoPhase === 'vertical_insertion') {
                const verticalAngle = -Math.PI / 2;
                if (ship.angle < verticalAngle - 0.02) {
                    if (Math.floor(now / 16) % 4 === 0) activeInputs['ArrowRight'] = true;
                } else if (ship.angle > verticalAngle + 0.02) {
                    if (Math.floor(now / 16) % 4 === 0) activeInputs['ArrowLeft'] = true;
                }

                // Only pulse if we've lost our upward momentum before hitting the zone
                if (ship.y > TARGET_ALT_Y + 10 && ship.yv > -5) {
                    activeInputs['ArrowUp'] = true;
                }

                if (Math.abs(distanceToZone) < ALT_ENVELOPE * 0.7) {
                    demoPhase = 'deploy';
                }
            }
            // --- PHASE 3: ORBITAL STABILIZATION & DEPLOYMENT ---
            else if (demoPhase === 'deploy') {
                // 1. HORIZONTAL VELOCITY TARGETING
                const xvError = targetHSpd - ship.xv;

                // Increased multiplier from 0.08 to 0.15 so it aggressively leans into the speed error
                let targetAngle = -Math.PI / 2 + (xvError * 0.15);

                // THE FIX: Allow a full 90-degree tilt. 
                // -Math.PI is pointing straight left (pure retro-burn). 
                // 0 is pointing straight right (pure pro-burn).
                targetAngle = Math.max(-Math.PI, Math.min(0, targetAngle));

                // SAFETY OVERRIDE: If the ship starts falling while trying to brake, 
                // force the nose back straight UP so the engine can catch the fall.
                if (ship.y > TARGET_ALT_Y || ship.yv > 2) {
                    targetAngle = -Math.PI / 2;
                }

                if (ship.angle < targetAngle - 0.02) activeInputs['ArrowRight'] = true;
                else if (ship.angle > targetAngle + 0.02) activeInputs['ArrowLeft'] = true;

                // 2. 2-AXIS STATION KEEPING (Vertical & Horizontal)
                const isAligned = Math.abs(ship.angle - targetAngle) < 0.15;
                const needsHorizCorrection = Math.abs(xvError) > 3;

                if (ship.y > TARGET_ALT_Y || ship.yv > 2) {
                    if (ship.yv > -4) activeInputs['ArrowUp'] = true; // Vertical thrust
                } else if (needsHorizCorrection && isAligned) {
                    activeInputs['ArrowUp'] = true; // Horizontal correction thrust
                }

                // 3. STRICT DEPLOYMENT ENVELOPE
                const isInZone = Math.abs(ship.y - TARGET_ALT_Y) < ALT_ENVELOPE;
                const isStabilizedVert = Math.abs(ship.yv) < 5;
                const isStabilizedHoriz = Math.abs(xvError) < 4;

                // Added `isInZone` to the final check so doors stay locked until we drop into the band
                if (isInZone && isStabilizedVert && isStabilizedHoriz && now - lastDeployTime > 1200 && satInventory > 0) {
                    deploySatellites();
                    lastDeployTime = now;
                }

                if (satInventory <= 0) {
                    demoPhase = 'prepare_land';
                    playSound('beep');
                }
            }

            // --- PHASE 4: AUTOLAND HANDOFF ---
            else if (demoPhase === 'prepare_land') {
                ship.autopilot = true;
                demoPhase = 'autopilot_active';
            }
        }



        function requestFullScreen(element) {
            if (element.requestFullscreen) {

            } else if (element.webkitRequestFullscreen) { // Required for Safari/iPad

            }
        }


        function getLayout() {
            const sR = canvas.width / canvas.height;
            const vR = virtualWidth / virtualHeight;
            let dW, dH, dX, dY;
            if (sR > vR) {
                dH = canvas.height; dW = dH * vR; dX = (canvas.width - dW) / 2; dY = 0;
            } else {
                dW = canvas.width; dH = dW / vR; dX = 0; dY = (canvas.height - dH) / 2;
            }
            return { dW, dH, dX, dY };
        }

            vCtx.save();
            vCtx.textAlign = 'center';
            vCtx.font = 'bold 16px sans-serif';

            // 1. Rotation Zone (Left)
            vCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            vCtx.fillRect(0, UI_CFG.sideY, UI_CFG.sideWidth, UI_CFG.sideHeight);
            vCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            vCtx.fillText("ROTATE", UI_CFG.sideWidth / 2, UI_CFG.sideY + 250);

            // 2. Thrust Zone (Right)
            vCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            vCtx.fillRect(virtualWidth - UI_CFG.sideWidth, UI_CFG.sideY, UI_CFG.sideWidth, UI_CFG.sideHeight);
            vCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            vCtx.fillText("THRUST", virtualWidth - (UI_CFG.sideWidth / 2), UI_CFG.sideY + 250);

            // 3. Bottom Buttons
            const buttons = [
                { key: 'KeyS', label: 'STAGE', x: UI_CFG.btnStageX },
                { key: 'KeyD', label: 'DEPLOY', x: UI_CFG.btnDeployX },
                { key: 'KeyA', label: 'AUTO', x: UI_CFG.btnAutoX }
            ];

            buttons.forEach(b => {
                vCtx.fillStyle = activeInputs[b.key] ? 'rgba(0, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.1)';
                vCtx.beginPath();
                vCtx.arc(b.x, UI_CFG.btnY, UI_CFG.btnRadius, 0, Math.PI * 2);
                vCtx.fill();
                vCtx.fillStyle = '#fff';
                vCtx.fillText(b.label, b.x, UI_CFG.btnY + 5);
            });
            vCtx.restore();
        }

        function handleInput(x, y, isDown, pointerId) {
            if (isDown) {
                // 1. Rotation Zone (Left)
                if (x < UI_CFG.sideWidth && y > UI_CFG.sideY && y < (UI_CFG.sideY + UI_CFG.sideHeight)) {
                    const action = (x < UI_CFG.sideWidth / 2) ? 'ArrowLeft' : 'ArrowRight';
                    updateInputState(action, true);
                    pointerActionMap.set(pointerId, action);
                }
                // 2. Thrust Zone (Right)
                else if (x >= (virtualWidth - UI_CFG.sideWidth) && y > UI_CFG.sideY && y < (UI_CFG.sideY + UI_CFG.sideHeight)) {
                    updateInputState('ArrowUp', true);
                    pointerActionMap.set(pointerId, 'ArrowUp');
                }
                // 3. Action Buttons (Bottom)
                // Check if Y is within the top/bottom bounds of the circles
                else if (y > (UI_CFG.btnY - UI_CFG.btnRadius) && y < (UI_CFG.btnY + UI_CFG.btnRadius)) {

                    // Check if X is within the left/right bounds of each specific circle
                    if (Math.abs(x - UI_CFG.btnStageX) <= UI_CFG.btnRadius) updateInputState('KeyS', true);
                    if (Math.abs(x - UI_CFG.btnDeployX) <= UI_CFG.btnRadius) updateInputState('KeyD', true);
                    if (Math.abs(x - UI_CFG.btnAutoX) <= UI_CFG.btnRadius) updateInputState('KeyA', true);

                    // Immediately release them so they don't get "stuck" pressed
                    setTimeout(() => {
                        updateInputState('KeyS', false);
                        updateInputState('KeyD', false);
                        updateInputState('KeyA', false);
                    }, 100);
                }
            } else {
                // When lifting finger, find which action it was holding
                const action = pointerActionMap.get(pointerId);
                if (action) {
                    updateInputState(action, false);
                    pointerActionMap.delete(pointerId);
                }
            }
        }

        // Add these Event Listeners
        canvas.addEventListener('touchstart', (e) => {
            [...e.changedTouches].forEach(t => {
                const rect = canvas.getBoundingClientRect();
                const x = (t.clientX - rect.left) * (virtualWidth / canvas.clientWidth);
                const y = (t.clientY - rect.top) * (virtualHeight / canvas.clientHeight);
                touchMap.set(t.identifier, { x, y });
                handleInput(x, y, true);
            });
        });

        canvas.addEventListener('touchend', (e) => {
            [...e.changedTouches].forEach(t => {
                touchMap.delete(t.identifier);
                // Reset all inputs on end for simplicity in this game loop
                Object.keys(activeInputs).forEach(k => activeInputs[k] = false);
            });
        });

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const layout = getLayout();

            // 1. Get raw click relative to canvas element
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            // 2. Adjust for black bars and scale
            const x = ((clientX - rect.left) - layout.dX) * (virtualWidth / layout.dW);
            const y = ((clientY - rect.top) - layout.dY) * (virtualHeight / layout.dH);

            return { x, y };
        }
