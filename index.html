<!DOCTYPE html>
<html lang="en">
<!-- LUNAR LAUNCHER: UNIFIED BITMAP EDITION -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Launcher</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        #splash-image {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        #msg {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            display: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border: 1px solid #005288;
            z-index: 300;
        }
    </style>
</head>

<body>

    <div id="splash">
        <img id="splash-image" src="splashScreen.png" alt="Lunar Launcher">
    </div>

    <div id="msg"></div>

    <canvas id="landCanvas"></canvas>

    <script>

        const planetImg = new Image();
        planetImg.src = 'saturn.jpg';

        const canvas = document.getElementById('landCanvas');
        const ctx = canvas.getContext('2d');
        let bgMusic = null;

        // --- BITMAP RENDERING SETUP ---
        const virtualWidth = 1920;
        const virtualPlayHeight = 1080; // The original gameplay arena
        const virtualHUDHeight = 140;   // The telemetry area
        const virtualHeight = virtualPlayHeight + virtualHUDHeight; // Total 1220px

        const offScreenCanvas = document.createElement('canvas');
        offScreenCanvas.width = virtualWidth;
        offScreenCanvas.height = virtualHeight;
        const vCtx = offScreenCanvas.getContext('2d');
        // ------------------------------

        const msgBox = document.getElementById('msg');
        const splashDiv = document.getElementById('splash');
        const splashImg = document.getElementById('splash-image');

        let width, height; // Logic will use 'height' for 1080 area
        const GRAVITY = 15; const THRUST = 44; const MAX_ROT_SPEED = 2.2;
        const ORBITAL_VELOCITY = 45; const VELOCITY_TOLERANCE = 12;
        const TIME_SCALE = 0.75; const LOST_BUFFER = 100;
        const EAGLE_WIDTH = 100; const EAGLE_HEIGHT = 50;
        let TARGET_ALT_Y; const ALT_ENVELOPE = 45;

        let ship, booster, terrain = [], pads = [], launchPad = {};
        let smokeTrail = [], stars = [], legacySats = [], backgroundObjects = [];
        let craters = [], satellites = [];

        let gameOver = false, separated = false, totalDeployed = 0, doorOpen = false, satInventory = 50;
        let lastTime = performance.now(), missionStart = lastTime;
        let demoPhase = 'launch', lastDeployTime = 0, instructionsStartTime = null;
        let animationId = null, pulseAngle = 0, cosmeticObjPulse = 0;
        let splashActive = true; let rotKeyHeldTime = 0; const keys = {};
        let timeSinceGameOver = 0, audioCtx = null, engineOsc = null, engineGain = null;

        // UI State Object (replaces DOM element properties)
        const uiState = {
            timer: "T+ 00:00",
            milestone: "OFFLINE",
            payloadText: "READY",
            payloadInZone: false,
            satCount: 0,
            mbps: 0
        };

        function resetGame() {
            const startX = (launchPad.x1 + launchPad.x2) / 2;
            const boosterY = launchPad.y - 25;
            const shipY = boosterY - 44;
            ship = { id: 'Ship', x: startX, y: shipY, xv: 0, yv: 0, width: 20, height: 60, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: false, landed: false, crashed: false, exploded: false, color: '#00a8a8' };
            booster = { id: 'Booster', x: startX, y: boosterY, xv: 0, yv: 0, width: 30, height: 50, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: false, landed: false, crashed: false, exploded: false, color: '#b0b0b0', legsVisible: true };
            demoPhase = 'launch'; separated = false; doorOpen = false; satInventory = 50; lastDeployTime = 0;
            msgBox.style.display = 'none'; missionStart = performance.now(); smokeTrail = [];
            generateCosmeticObjects();
        }

        // function initAudio() {
        //     if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
        //     audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        //     audioCtx.resume();
        //     engineOsc = audioCtx.createOscillator(); engineGain = audioCtx.createGain();
        //     engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
        //     engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
        //     engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination);
        //     engineOsc.start();
        // }


        function initAudio() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            // --- ADD THIS BLOCK ---
            if (!bgMusic) {
                bgMusic = new Audio('gameMusic.mp3');
                bgMusic.loop = true;
                bgMusic.volume = 0.4; // Adjust this (0.0 to 1.0) so it doesn't drown out engines
            }
            // -----------------------

            engineOsc = audioCtx.createOscillator(); engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
            engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            if (type === 'deploy') { o.type = 'triangle'; o.frequency.setValueAtTime(440, now); o.frequency.exponentialRampToValueAtTime(880, now + 0.1); g.gain.setValueAtTime(0.05, now); g.gain.linearRampToValueAtTime(0, now + 0.1); o.start(); o.stop(now + 0.1); }
            else if (type === 'sep') { o.type = 'sawtooth'; o.frequency.setValueAtTime(110, now); g.gain.setValueAtTime(0.1, now); g.gain.linearRampToValueAtTime(0, now + 0.2); o.start(); o.stop(now + 0.2); }
            else if (type === 'crash') { o.type = 'sawtooth'; o.frequency.setValueAtTime(60, now); o.frequency.exponentialRampToValueAtTime(30, now + 0.8); g.gain.setValueAtTime(0.3, now); g.gain.linearRampToValueAtTime(0, now + 0.8); o.start(); o.stop(now + 0.8); }
            else if (type === 'success') { [523, 659, 783, 1046].forEach((f, i) => { const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain(); o2.type = 'square'; o2.connect(g2); g2.connect(audioCtx.destination); o2.frequency.setValueAtTime(f, now + i * 0.1); g2.gain.setValueAtTime(0.04, now + i * 0.1); g2.gain.linearRampToValueAtTime(0, now + i * 0.1 + 0.2); o2.start(now + i * 0.1); o2.stop(now + i * 0.1 + 0.2); }); }
        }

        function setEngineVolume(vol) { if (engineGain) engineGain.gain.setTargetAtTime(vol * 0.05, audioCtx.currentTime, 0.05); }

        async function triggerSplashScreen() {
            splashActive = true; splashDiv.style.opacity = "1";
            setTimeout(() => { if (splashImg) splashImg.style.opacity = "1"; }, 100);
            playIntroSong();
            setTimeout(() => {
                splashDiv.style.opacity = "0";
                setTimeout(() => { splashDiv.style.display = 'none'; splashActive = false; missionStart = performance.now(); instructionsStartTime = performance.now(); if (bgMusic) bgMusic.play(); }, 1500);
            }, 4000);

        }

        function init(keepAutopilot = false, isReset = false) {
            if (animationId) cancelAnimationFrame(animationId);
            width = virtualWidth;
            height = virtualPlayHeight; // Constant 1080 for physics
            TARGET_ALT_Y = height * 0.25; gameOver = false; separated = false; totalDeployed = 0; doorOpen = false; satInventory = 50; timeSinceGameOver = 0;
            if (!isReset) { satellites = []; splashActive = true; } else { splashActive = false; }
            instructionsStartTime = null; msgBox.style.display = 'none';
            const now = performance.now(); lastTime = now; missionStart = now;
            smokeTrail = []; legacySats = []; backgroundObjects = []; rotKeyHeldTime = 0; cosmeticObjPulse = 0;
            generateTerrain(); generateCosmeticObjects();
            const startX = (launchPad.x1 + launchPad.x2) / 2;
            const boosterY = launchPad.y - 25; const shipY = boosterY - 44;
            ship = { id: 'Ship', x: startX, y: shipY, xv: 0, yv: 0, width: 20, height: 60, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: keepAutopilot, landed: false, crashed: false, exploded: false, color: '#00a8a8' };
            booster = { id: 'Booster', x: startX, y: boosterY, xv: 0, yv: 0, width: 30, height: 50, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: keepAutopilot, landed: false, crashed: false, exploded: false, color: '#b0b0b0', legsVisible: true };
            stars = [];
            for (let i = 0; i < 150; i++) stars.push({ x: Math.random() * width, y: Math.random() * (height * 0.66), size: Math.random() * 1.5, opacity: Math.random() });
            for (let i = 0; i < 20; i++) legacySats.push({ x: Math.random() * width, y: TARGET_ALT_Y + (Math.random() - 0.5) * (ALT_ENVELOPE * 3), vx: 35 + Math.random() * 25, vy: (Math.random() - 0.5) * 10, size: 3, opacity: 0.2 + Math.random() * 0.3 });
            if (!isReset) triggerSplashScreen(); else { splashDiv.style.display = 'none'; instructionsStartTime = performance.now(); }
            lastTime = performance.now(); animationId = requestAnimationFrame(update);
        }

        function generateTerrain() {
            terrain = []; pads = []; const points = 220; const spacing = width / points; const seed = Math.random() * 1000;
            // const getTerrainHeight = (x) => {
            //     const h1 = Math.sin(x * 0.003 + seed) * 130;
            //     const h2 = Math.sin(x * 0.01 + seed * 1.5) * 60;
            //     const h3 = Math.sin(x * 0.025 + seed * 2) * 15;
            //     return height - (350 + h1 + h2 + h3);
            // };
            const getTerrainHeight = (x) => {
                // Reduce these multipliers to flatten the terrain
                const h1 = Math.sin(x * 0.003 + seed) * 50;  // Was 130 (Large mountains)
                const h2 = Math.sin(x * 0.01 + seed * 1.5) * 20; // Was 60  (Medium hills)
                const h3 = Math.sin(x * 0.025 + seed * 2) * 5;   // Was 15  (Surface detail/crags)

                // This base offset (350) determines the average height of the ground
                return height - (200 + h1 + h2 + h3);
            };

            const lpStart = 10, lpEnd = 25;
            const lpY = getTerrainHeight(lpStart * spacing);
            launchPad = { x1: lpStart * spacing, x2: lpEnd * spacing, y: lpY };
            const p1Start = Math.floor(points * (0.15 + Math.random() * 0.30));
            const p2Start = Math.floor(points * (0.60 + Math.random() * 0.25));
            const padPointWidth = 7;
            for (let i = 0; i <= points; i++) {
                let tx = i * spacing; let ty;
                if (i >= lpStart && i <= lpEnd) ty = lpY;
                else if (i >= p1Start && i <= p1Start + padPointWidth) { ty = getTerrainHeight(p1Start * spacing); if (i === p1Start) pads.push({ x1: tx, x2: tx + (padPointWidth * spacing), y: ty, owner: 'Booster' }); }
                else if (i >= p2Start && i <= p2Start + padPointWidth) { ty = getTerrainHeight(p2Start * spacing); if (i === p2Start) pads.push({ x1: tx, x2: tx + (padPointWidth * spacing), y: ty, owner: 'Ship' }); }
                else ty = getTerrainHeight(tx);
                terrain.push({ x: tx, y: ty });
            }
            craters = [];
            for (let i = 0; i < 10; i++) {
                const x = Math.random() * width; const groundPoint = terrain.find(p => p.x > x) || terrain[terrain.length - 1];
                craters.push({ x: x, y: groundPoint.y + 15 + Math.random() * 80, radiusX: 10 + Math.random() * 40, radiusY: 4 + Math.random() * 12, alpha: 0.1 + Math.random() * 0.2 });
            }
        }

        function generateCosmeticObjects() {
            backgroundObjects = [];
            for (let i = 0; i < 2; i++) backgroundObjects.push({ type: 'Eagle', x: Math.random() * width, y: height - 400 - Math.random() * 100, size: 0.35, speed: 25 + Math.random() * 15, direction: Math.random() > 0.5 ? 1 : -1, alpha: 0.8, tilt: 0, isGrounded: false });
            for (let i = 0; i < 3; i++) backgroundObjects.push({ type: 'Buggy', x: (width * 0.1) + Math.random() * (width * 0.8), y: 0, size: 0.6, speed: 6 + Math.random() * 4, direction: Math.random() > 0.5 ? 1 : -1, alpha: 0.8, angle: 0, isGrounded: true });
            // Radar Station
            if (pads.length >= 2) {
                const pad1Center = (pads[0].x1 + pads[0].x2) / 2;
                const pad2Center = (pads[1].x1 + pads[1].x2) / 2;
                const midPointX = (pad1Center + pad2Center) / 2;

                // Spawn 1 Radar Station at exactly the midpoint
                backgroundObjects.push({
                    type: 'Radar',
                    x: midPointX,
                    y: 0, // isGrounded logic handles the Y and Angle automatically
                    size: 1.0,
                    speed: 0,
                    direction: 1,
                    alpha: 0.8,
                    angle: 0,
                    isGrounded: true
                });
            }
        }

        function deploySatellites() {
            if (gameOver || satInventory <= 0 || splashActive) return;
            if (satellites.length >= 300) { satInventory = 0; uiState.milestone = "CONSTELLATION AT CAPACITY"; return; }
            playSound('deploy'); doorOpen = true; satInventory -= 10; totalDeployed += 10;
            for (let i = 0; i < 10; i++) satellites.push({ x: ship.x, y: ship.y, vx: ship.xv + (Math.random() - 0.5) * 2, vy: ship.yv + (Math.random() - 0.5) * 2, size: 4, opacity: 1.0, heat: 0, vaporizeAlt: height - (300 + Math.random() * 150) });
        }

        function triggerExplosion(x, y) {
            if (audioCtx) playSound('crash');
            for (let i = 0; i < 20; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160, life: 0.5, size: 2, plasma: true });
            for (let i = 0; i < 10; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, life: 1.0, size: 5, plasma: true });
            for (let i = 0; i < 3; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 2.0, size: 25, plasma: true });
        }

        function triggerSeparationSmoke(x, y) { for (let i = 0; i < 45; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.5) * 18, life: 0.8, size: 3.5, plasma: false }); }
        function triggerLandingPuff(x, y) { for (let i = 0; i < 35; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 10 - 5, life: 1.2, size: 4.5, plasma: false, isOrange: true }); }

        // --- NEW BITMAP HUD DRAWING LOGIC ---
        function renderGaugeDualToHUD(ctx, x, y, val1, val2, max1, max2, label, type) {
            const cx = x + 40, cy = y + 40;
            ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(cx, cy, 35, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.stroke();
            ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#00ffff'; ctx.fillText(Math.round(val1), cx, cy - 18);
            ctx.fillStyle = '#ffffff'; ctx.fillText(Math.round(val2), cx, cy + 2);
            if (type === 'hspd') { const angle = -Math.PI / 2 + (Math.PI * 2 * (ORBITAL_VELOCITY / max1)); ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx + 32 * Math.cos(angle), cy + 32 * Math.sin(angle)); ctx.lineTo(cx + 39 * Math.cos(angle), cy + 39 * Math.sin(angle)); ctx.stroke(); }
            if (type === 'alt') { const targetAltVal = pads[0] ? pads[0].y - TARGET_ALT_Y : height; const angle = -Math.PI / 2 + (Math.PI * 2 * (targetAltVal / max1)); ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx + 32 * Math.cos(angle), cy + 32 * Math.sin(angle)); ctx.lineTo(cx + 39 * Math.cos(angle), cy + 39 * Math.sin(angle)); ctx.stroke(); }
            ctx.strokeStyle = '#00ffff'; ctx.beginPath(); ctx.arc(cx, cy, 35, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * Math.min(Math.abs(val1) / max1, 1))); ctx.stroke();
            ctx.strokeStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, cy, 28, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * Math.min(Math.abs(val2) / max2, 1))); ctx.stroke();
            ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#666'; ctx.fillText(label, cx, cy + 60);
        }

        function drawHUD() {
            const hY = virtualPlayHeight;
            vCtx.fillStyle = 'rgba(10, 10, 10, 0.95)'; vCtx.fillRect(0, hY, virtualWidth, virtualHUDHeight);
            vCtx.strokeStyle = '#333'; vCtx.lineWidth = 1; vCtx.beginPath(); vCtx.moveTo(0, hY); vCtx.lineTo(virtualWidth, hY); vCtx.stroke();

            // 1. Instructions
            vCtx.fillStyle = '#888'; vCtx.font = '18px sans-serif'; vCtx.textAlign = 'left'; vCtx.textBaseline = 'top';
            vCtx.fillText("ARROWS: THRUST & ROTATION", 30, hY + 25);
            vCtx.fillText("S KEY: STAGE SEPARATION", 30, hY + 50);
            vCtx.fillText("D KEY: DEPLOY SATELLITES!", 30, hY + 75);
            vCtx.fillText("A KEY: AUTO LAND ENABLE", 30, hY + 100);

            // 2. Inventory
            vCtx.textAlign = 'center'; vCtx.fillStyle = '#00ffff'; vCtx.font = 'bold 32px monospace';
            vCtx.fillText(satInventory, 460, hY + 40);
            vCtx.font = 'bold 10px sans-serif'; vCtx.fillStyle = '#666'; vCtx.fillText("SATS REMAINING", 460, hY + 95);

            // 3. Gauges
            renderGaugeDualToHUD(vCtx, 550, hY + 20, ship.xv, booster.xv, 80, 80, "HORIZONTAL SPD", 'hspd');
            renderGaugeDualToHUD(vCtx, 680, hY + 20, ship.yv, booster.yv, 60, 60, "VERTICAL SPD", null);
            const padS = pads.find(p => p.owner === 'Ship') || { y: height }; const padB = pads.find(p => p.owner === 'Booster') || { y: height };
            renderGaugeDualToHUD(vCtx, 810, hY + 20, padS.y - (ship.y + 25), padB.y - (booster.y + 25), height, height, "ALTITUDE", 'alt');

            // 4. Payload Zone
            vCtx.strokeStyle = uiState.payloadInZone ? '#0f0' : '#444'; vCtx.lineWidth = 2;
            vCtx.beginPath(); vCtx.arc(980, hY + 60, 40, 0, Math.PI * 2); vCtx.stroke();
            vCtx.fillStyle = uiState.payloadInZone ? '#0f0' : '#666'; vCtx.font = 'bold 12px sans-serif';
            vCtx.fillText(uiState.payloadText, 980, hY + 50);
            vCtx.fillStyle = '#666'; vCtx.fillText("PAYLOAD ZONE", 980, hY + 115);

            // 5. Fuel
            renderGaugeDualToHUD(vCtx, 1070, hY + 20, ship.fuel, booster.fuel, 500, 500, "PROPELLANT", null);

            // 6. Mission Time
            vCtx.fillStyle = '#00ffff'; vCtx.font = '16px monospace';
            vCtx.fillText(uiState.timer, 1220, hY + 65);
            vCtx.font = 'bold 10px sans-serif'; vCtx.fillStyle = '#666'; vCtx.fillText("MISSION TIME", 1220, hY + 115);

            // 7. Auto Land
            const active = ship.autopilot; vCtx.strokeStyle = active ? '#0f0' : '#333'; vCtx.lineWidth = 4;
            vCtx.beginPath(); vCtx.arc(1340, hY + 60, 35, 0, Math.PI * 2); vCtx.stroke();
            vCtx.fillStyle = active ? `rgba(0, 255, 0, ${0.3 + Math.sin(pulseAngle) * 0.2})` : '#111';
            vCtx.beginPath(); vCtx.arc(1340, hY + 60, 15, 0, Math.PI * 2); vCtx.fill();
            vCtx.fillStyle = '#fff'; vCtx.font = '10px Arial'; vCtx.fillText(active ? "AUTO" : "MANUAL", 1340, hY + 65);
            vCtx.fillStyle = '#666'; vCtx.fillText("AUTOLAND [A]", 1340, hY + 115);

            // 8. Network Ops
            const cxB = 1480, cyB = hY + 60; vCtx.strokeStyle = '#1a1a1a'; vCtx.lineWidth = 6;
            vCtx.beginPath(); vCtx.arc(cxB, cyB, 32, Math.PI * 0.8, Math.PI * 2.2); vCtx.stroke();
            const pct = Math.min(uiState.mbps / 200, 1);
            const grad = vCtx.createLinearGradient(cxB - 40, cyB, cxB + 40, cyB); grad.addColorStop(0, '#ff00ff'); grad.addColorStop(1, '#00ffff');
            vCtx.strokeStyle = grad; vCtx.beginPath(); vCtx.arc(cxB, cyB, 32, Math.PI * 0.8, Math.PI * 0.8 + (Math.PI * 1.4 * pct)); vCtx.stroke();
            vCtx.fillStyle = '#ff00ff'; vCtx.font = 'bold 15px monospace'; vCtx.fillText(Math.floor(uiState.mbps), cxB, cyB + 12);
            vCtx.font = '12px monospace'; vCtx.fillText("MBPS", cxB, cyB + 25); vCtx.fillStyle = '#666'; vCtx.font = 'bold 10px sans-serif'; vCtx.fillText("BANDWIDTH", cxB, hY + 115);

            vCtx.textAlign = 'left'; vCtx.fillStyle = '#ff00ff'; vCtx.font = 'bold 20px monospace';
            vCtx.fillText(`SATS: ${uiState.satCount}`, 1600, hY + 50);
            vCtx.font = '14px monospace'; vCtx.fillText(uiState.milestone, 1600, hY + 75);
            vCtx.fillStyle = '#666'; vCtx.font = 'bold 10px sans-serif'; vCtx.fillText("NETWORK OPS", 1600, hY + 115);
        }

        function runAI(obj, dt) {
            if (splashActive) return;
            let fuelTarget = (obj === ship && !separated) ? booster : obj;
            if (fuelTarget.fuel <= 0 || obj.landed || obj.crashed) { obj.thrusting = false; return; }
            const myPad = pads.find(p => p.owner === obj.id); if (!myPad) return;
            const padCenterX = (myPad.x1 + myPad.x2) / 2;
            const dx = padCenterX - obj.x; const xvError = (dx * 0.26) - (obj.xv * 0.9);
            let targetAngle = -Math.PI / 2 + (xvError * 0.05);
            targetAngle = Math.max(-Math.PI / 2 - 0.85, Math.min(-Math.PI / 2 + 0.85, targetAngle));
            const angleErr = targetAngle - obj.angle; const rotStep = MAX_ROT_SPEED * dt;
            if (Math.abs(angleErr) < rotStep) obj.angle = targetAngle; else obj.angle += Math.sign(angleErr) * rotStep;
            const targetOffset = (obj.id === 'Booster' && separated) ? 36 : 25;
            const altitude = myPad.y - (obj.y + targetOffset);
            let targetYv = (altitude < 40 && Math.abs(dx) > 35) ? -2 : Math.sqrt(Math.max(0, altitude) * 5.0) + 7;
            if (targetYv > 80) targetYv = 80;

            if (type === 'ship' || obj.legsVisible) {
                ctx.strokeStyle = obj.color; ctx.beginPath(); const yBase = (type === 'booster') ? 18 : 15;
                ctx.moveTo(-8.1, yBase); ctx.lineTo(-14.4, yBase + 10); ctx.lineTo(-18.9, yBase + 10);
                ctx.moveTo(8.1, yBase); ctx.lineTo(14.4, yBase + 10); ctx.lineTo(18.9, yBase + 10); ctx.stroke();
            }
            const active = !separated ? (obj === booster && ship.thrusting) : obj.thrusting;
            const currentFuel = (!separated && obj === booster) ? booster.fuel : obj.fuel;
            if (active && (currentFuel > 0 || !separated) && !obj.landed) {
                const grad = ctx.createLinearGradient(0, 20, 0, 60); grad.addColorStop(0, '#ffcc00'); grad.addColorStop(0.5, '#ff6600'); grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad; ctx.beginPath(); const yStart = (type === 'booster') ? 24 : 20;
                ctx.moveTo(-5.4, yStart); ctx.quadraticCurveTo(0, yStart + 40, 5.4, yStart); ctx.fill();
            }
            ctx.restore();
        }

        function draw() {
            vCtx.fillStyle = '#000'; vCtx.fillRect(0, 0, virtualWidth, virtualHeight);
            stars.forEach(s => { vCtx.fillStyle = `rgba(255,255,255,${s.opacity})`; vCtx.fillRect(s.x, s.y, s.size, s.size); });
            vCtx.save(); vCtx.setLineDash([10, 10]); vCtx.lineWidth = 1; vCtx.strokeStyle = 'rgba(100, 100, 100, 1)'; vCtx.beginPath(); vCtx.moveTo(0, TARGET_ALT_Y - ALT_ENVELOPE);
            vCtx.lineTo(width, TARGET_ALT_Y - ALT_ENVELOPE); vCtx.moveTo(0, TARGET_ALT_Y + ALT_ENVELOPE); vCtx.lineTo(width, TARGET_ALT_Y + ALT_ENVELOPE); vCtx.stroke(); vCtx.restore();

            // Draw Saturn
            if (planetImg.complete) {
                vCtx.save();
                vCtx.globalAlpha = 0.5; 
                vCtx.drawImage(planetImg, 1200, 100, 110, 58);
                vCtx.restore();
            }

            backgroundObjects.forEach(obj => {
                if (obj.crashed) return;
                if (obj.type === 'Eagle') drawCosmeticEagle(vCtx, obj, obj.alpha);
                if (obj.type === 'Radar') drawCosmeticRadarStation(vCtx, obj, obj.alpha);
                if (obj.type === 'Buggy') drawCosmeticBuggy(vCtx, obj, obj.alpha);
            });

            // --- RESTORED INSTRUCTIONS OVERLAY ---
            const now = performance.now();
            if (instructionsStartTime && (now - instructionsStartTime) < 5000) { vCtx.save(); vCtx.letterSpacing = "4px"; vCtx.font = '30px "Lucida Console", Monaco, monospace'; vCtx.fillStyle = 'rgba(0, 255, 255, 0.7)'; vCtx.textAlign = 'center'; vCtx.textBaseline = 'middle'; vCtx.fillText('Deploy Satellites Into Orbit', width / 2, TARGET_ALT_Y); vCtx.restore(); }

            smokeTrail.forEach(p => { let color; if (p.plasma) color = `rgba(255, ${Math.random() * 150 + 100}, 0, ${p.life * 0.8})`; else if (p.isOrange) color = `rgba(255, 140, 0, ${p.life * 0.6})`; else color = `rgba(140,140,140,${p.life * 0.3})`; vCtx.fillStyle = color; vCtx.beginPath(); vCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); vCtx.fill(); });
            vCtx.strokeStyle = '#555'; vCtx.lineWidth = 9; vCtx.beginPath(); vCtx.moveTo(launchPad.x1, launchPad.y); vCtx.lineTo(launchPad.x2, launchPad.y); vCtx.stroke();
            //            pads.forEach(p => { vCtx.strokeStyle = p.owner === 'Ship' ? '#00ffff' : '#ffffff'; vCtx.lineWidth = 6; vCtx.beginPath(); vCtx.moveTo(p.x1 - 5, p.y - 1); vCtx.lineTo(p.x2 + 5, p.y - 1); vCtx.stroke(); if (p.owner === 'Booster') { let cX = (p.x1 + p.x2) / 2; vCtx.strokeStyle = '#303030'; vCtx.lineWidth = 2; vCtx.beginPath(); vCtx.moveTo(cX + 15, p.y); vCtx.lineTo(cX + 15, p.y - 80); vCtx.moveTo(cX + 20, p.y); vCtx.lineTo(cX + 20, p.y - 80); vCtx.stroke(); vCtx.strokeStyle = '#404040'; vCtx.lineWidth = 3; vCtx.beginPath(); vCtx.moveTo(cX + 15, p.y - 59); vCtx.lineTo(cX - 9, p.y - 59); vCtx.stroke(); } });
            craters.forEach(c => { vCtx.strokeStyle = `rgba(120, 120, 120, ${c.alpha})`; vCtx.lineWidth = 2; vCtx.beginPath(); vCtx.ellipse(c.x, c.y, c.radiusX, c.radiusY, 0, 0, Math.PI * 2); vCtx.stroke(); });
            vCtx.strokeStyle = '#444'; vCtx.lineWidth = 1.5; vCtx.beginPath(); vCtx.moveTo(terrain[0].x, terrain[0].y); terrain.forEach(p => vCtx.lineTo(p.x, p.y)); vCtx.stroke();
            drawRocket(vCtx, ship, 'ship'); drawRocket(vCtx, booster, 'booster');
            legacySats.forEach(s => { vCtx.fillStyle = `rgba(180, 240, 255, ${s.opacity})`; vCtx.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size); });
            satellites.forEach(s => { const heatRatio = Math.min(s.heat / 5, 1); const r = Math.floor(200 + (55 * heatRatio)), g = Math.floor(255 * (1 - heatRatio)), b = Math.floor(255 * (1 - heatRatio)); const streakLen = 0.1 + (heatRatio * 0.8); vCtx.save(); const grad = vCtx.createLinearGradient(s.x, s.y, s.x - s.vx * streakLen, s.y - s.vy * streakLen); grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${s.opacity})`); grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`); vCtx.strokeStyle = grad; vCtx.lineWidth = 1 + (heatRatio * 1); vCtx.beginPath(); vCtx.moveTo(s.x, s.y); vCtx.lineTo(s.x - s.vx * streakLen, s.y - s.vy * streakLen); vCtx.stroke(); vCtx.restore(); vCtx.fillStyle = `rgba(${r}, ${g}, ${b}, ${s.opacity})`; vCtx.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size); });
            pads.forEach(p => { vCtx.strokeStyle = p.owner === 'Ship' ? '#00ffff' : '#ffffff'; vCtx.lineWidth = 6; vCtx.beginPath(); vCtx.moveTo(p.x1 - 5, p.y - 1); vCtx.lineTo(p.x2 + 5, p.y - 1); vCtx.stroke(); if (p.owner === 'Booster') { let cX = (p.x1 + p.x2) / 2; vCtx.strokeStyle = '#303030'; vCtx.lineWidth = 2; vCtx.beginPath(); vCtx.moveTo(cX + 15, p.y); vCtx.lineTo(cX + 15, p.y - 80); vCtx.moveTo(cX + 20, p.y); vCtx.lineTo(cX + 20, p.y - 80); vCtx.stroke(); vCtx.strokeStyle = '#404040'; vCtx.lineWidth = 3; vCtx.beginPath(); vCtx.moveTo(cX + 15, p.y - 59); vCtx.lineTo(cX - 9, p.y - 59); vCtx.stroke(); } });





            drawHUD(); // New Bitmap HUD draw call

            //ctx.clearRect(0, 0, canvas.width, canvas.height);
            //ctx.drawImage(offScreenCanvas, 0, 0, virtualWidth, virtualHeight, 0, 0, canvas.width, canvas.height);


            // --- ASPECT RATIO CORRECTION ---
            const screenRatio = canvas.width / canvas.height;
            const virtualRatio = virtualWidth / virtualHeight;
            let drawW, drawH, dx, dy;

            if (screenRatio > virtualRatio) {
                // Window is wider than the game (Pillarbox)
                drawH = canvas.height;
                drawW = drawH * virtualRatio;
                dx = (canvas.width - drawW) / 2;
                dy = 0;
            } else {
                // Window is taller than the game (Letterbox)
                drawW = canvas.width;
                drawH = drawW / virtualRatio;
                dx = 0;
                dy = (canvas.height - drawH) / 2;
            }

            ctx.fillStyle = '#000'; // Fill background for bars
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(offScreenCanvas, 0, 0, virtualWidth, virtualHeight, dx, dy, drawW, drawH);

        }


        function handleEagleEvasion() {
            const scanDistX = 200; // How far in front they look
            const scanDistY = 300; // How far above they look

            backgroundObjects.forEach(eagle => {
                // Only flying, non-crashed Eagles use radar
                if (eagle.type !== 'Eagle' || eagle.crashed) return;

                const targets = [ship, booster];
                let threatFound = false;

                for (let target of targets) {
                    if (target.exploded) continue;

                    // Calculate horizontal distance relative to Eagle's direction
                    // (A positive result means the target is in front of the Eagle)
                    const dx = (target.x - eagle.x) * eagle.direction;

                    // Calculate vertical distance (positive means target is higher than Eagle)
                    const dy = eagle.y - target.y;

                    // If target is in the "Front-Above" quadrant
                    if (dx > 0 && dx < scanDistX && dy > 0 && dy < scanDistY) {
                        threatFound = true;
                        break;
                    }
                }

                if (threatFound) {
                    eagle.direction *= -1; // Reverse direction
                    eagle.x += eagle.direction * 5; // Small nudge to prevent frame-flip jitter
                }
            });
        }



        window.addEventListener('keydown', e => {
            if (!audioCtx) initAudio();
            if (splashActive && e.code === 'Space') { splashActive = false; splashDiv.style.display = 'none'; missionStart = performance.now(); instructionsStartTime = performance.now(); return; }
            if (splashActive) return;
            keys[e.code] = true;
            if (e.code === 'KeyR') { init(false, true); return; }
            if (e.code === 'KeyS' && !separated) { const midX = (ship.x + booster.x) / 2, midY = (ship.y + booster.y) / 2; triggerSeparationSmoke(midX, midY); playSound('sep'); separated = true; booster.autopilot = true; booster.yv += 22; ship.yv -= 10; }
            if (e.code === 'KeyD') deploySatellites();
            if (e.code === 'KeyA') { ship.autopilot = !ship.autopilot; }
            if (e.code === 'Space' && gameOver) init(false, true);
        });

        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('mousedown', () => { if (!audioCtx) initAudio(); });
        //window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });


        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        function playIntroSong() {
            if (!audioCtx) initAudio();
            const now = audioCtx.currentTime;
            [[523.25, 0.0, 0.15], [659.25, 0.2, 0.15], [783.99, 0.4, 0.15], [1046.5, 0.6, 0.3], [783.99, 0.9, 0.1], [1046.5, 1.0, 0.5]].forEach(([f, d, du]) => { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(f, now + d); g.gain.setValueAtTime(0.06, now + d); g.gain.exponentialRampToValueAtTime(0.001, now + d + du); o.connect(g); g.connect(audioCtx.destination); o.start(now + d); o.stop(now + d + du); });
        }

        function demoUpdate() {
            if (splashActive || gameOver) { demoPhase = 'launch'; return; }

            const now = performance.now();
            keys['ArrowRight'] = false;
            keys['ArrowLeft'] = false;
            keys['ArrowUp'] = false;

            const targetHSpd = ORBITAL_VELOCITY;
            const distanceToZone = ship.y - TARGET_ALT_Y;
            const currentAlt = pads[0] ? pads[0].y - ship.y : height - ship.y;

            // --- PHASE 1: VELOCITY & ALTITUDE BOOST ---
            if (demoPhase === 'launch') {
                // 1. CALCULATE TARGETS
                const predictedApogeeY = ship.y - (Math.pow(Math.min(0, ship.yv), 2) / (2 * GRAVITY));
                const trajectoryReady = predictedApogeeY <= TARGET_ALT_Y + (ALT_ENVELOPE / 2);
                const speedReady = ship.xv >= targetHSpd;

                // 2. DYNAMIC THROTTLE (Prioritize Altitude First)
                if (!trajectoryReady) {
                    if (ship.yv > -70) keys['ArrowUp'] = true;
                } else {
                    if (!speedReady && ship.yv > -15) keys['ArrowUp'] = true;
                }

                // 3. STABILIZED TILT (Programmatic Gravity Turn)
                // Calculate height specifically relative to the starting pad surface
                // (69 is the combined offset of the booster and ship heights at t=0)
                const altAboveStart = launchPad.y - (ship.y + 69);

                // Wait until the ship has climbed 100px above the pad before tilting
                if (altAboveStart > 20) {
                    // turnProgress now starts at 0 exactly when the ship hits 100px altitude
                    const turnProgress = Math.min(1, (altAboveStart - 20) / 350);

                    // targetAngle moves from -90 degrees toward -45 degrees
                    const targetAngle = -Math.PI / 2 + (Math.PI / 4) * turnProgress;

                    if (ship.angle < targetAngle) {
                        // Pulse the right arrow to turn smoothly
                        if (Math.floor(now / 16) % 2 === 0) keys['ArrowRight'] = true;
                    }
                }

                // 4. SECURE INSERTION & SEPARATION
                if (speedReady && trajectoryReady) {
                    if (!separated) {
                        const midX = (ship.x + booster.x) / 2, midY = (ship.y + booster.y) / 2;
                        triggerSeparationSmoke(midX, midY);
                        playSound('sep');
                        separated = true;
                        booster.autopilot = true;

                        booster.yv += 22;
                        ship.yv -= 10;
                    }
                    demoPhase = 'vertical_insertion';
                }
            }

            // --- PHASE 2: VERTICAL INSERTION ---
            else if (demoPhase === 'vertical_insertion') {
                const verticalAngle = -Math.PI / 2;
                if (ship.angle < verticalAngle - 0.02) {
                    if (Math.floor(now / 16) % 4 === 0) keys['ArrowRight'] = true;
                } else if (ship.angle > verticalAngle + 0.02) {
                    if (Math.floor(now / 16) % 4 === 0) keys['ArrowLeft'] = true;
                }

                // Only pulse if we've lost our upward momentum before hitting the zone
                if (ship.y > TARGET_ALT_Y + 10 && ship.yv > -5) {
                    keys['ArrowUp'] = true;
                }

                if (Math.abs(distanceToZone) < ALT_ENVELOPE * 0.7) {
                    demoPhase = 'deploy';
                }
            }
            // --- PHASE 3: ORBITAL STABILIZATION & DEPLOYMENT ---
            else if (demoPhase === 'deploy') {
                // 1. HORIZONTAL VELOCITY TARGETING
                const xvError = targetHSpd - ship.xv;

                // Increased multiplier from 0.08 to 0.15 so it aggressively leans into the speed error
                let targetAngle = -Math.PI / 2 + (xvError * 0.15);

                // THE FIX: Allow a full 90-degree tilt. 
                // -Math.PI is pointing straight left (pure retro-burn). 
                // 0 is pointing straight right (pure pro-burn).
                targetAngle = Math.max(-Math.PI, Math.min(0, targetAngle));

                // SAFETY OVERRIDE: If the ship starts falling while trying to brake, 
                // force the nose back straight UP so the engine can catch the fall.
                if (ship.y > TARGET_ALT_Y || ship.yv > 2) {
                    targetAngle = -Math.PI / 2;
                }

                if (ship.angle < targetAngle - 0.02) keys['ArrowRight'] = true;
                else if (ship.angle > targetAngle + 0.02) keys['ArrowLeft'] = true;

                // 2. 2-AXIS STATION KEEPING (Vertical & Horizontal)
                const isAligned = Math.abs(ship.angle - targetAngle) < 0.15;
                const needsHorizCorrection = Math.abs(xvError) > 3;

                if (ship.y > TARGET_ALT_Y || ship.yv > 2) {
                    if (ship.yv > -4) keys['ArrowUp'] = true; // Vertical thrust
                } else if (needsHorizCorrection && isAligned) {
                    keys['ArrowUp'] = true; // Horizontal correction thrust
                }

                // 3. STRICT DEPLOYMENT ENVELOPE
                const isInZone = Math.abs(ship.y - TARGET_ALT_Y) < ALT_ENVELOPE;
                const isStabilizedVert = Math.abs(ship.yv) < 5;
                const isStabilizedHoriz = Math.abs(xvError) < 4;

                // Added `isInZone` to the final check so doors stay locked until we drop into the band
                if (isInZone && isStabilizedVert && isStabilizedHoriz && now - lastDeployTime > 1200 && satInventory > 0) {
                    deploySatellites();
                    lastDeployTime = now;
                }

                if (satInventory <= 0) {
                    demoPhase = 'prepare_land';
                    playSound('beep');
                }
            }

            // --- PHASE 4: AUTOLAND HANDOFF ---
            else if (demoPhase === 'prepare_land') {
                ship.autopilot = true;
                demoPhase = 'autopilot_active';
            }
        }

        const startLanding = () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); init(false); window.removeEventListener('mousedown', startLanding); window.removeEventListener('keydown', startLanding); };
        window.addEventListener('mousedown', startLanding); window.addEventListener('keydown', startLanding);

        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    </script>
