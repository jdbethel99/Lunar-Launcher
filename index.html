<!DOCTYPE html>
<html lang="en">
<!-- LUNAR LAUNCHER: Full-Detail Rendering + Terrain Buggies + Detailed Eagles + PERSISTENT CONSTELLATION + NETWORK OPS + STARTUP INSTRUCTIONS -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar Launcher</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        #splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }

        #splash-image {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        #telemetry-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid #333;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
            padding: 0 30px;
            box-sizing: border-box;
            backdrop-filter: blur(15px);
            z-index: 200;
        }

        .instructions-box {
            width: 380px;
            font-size: 18px;
            color: #888;
            border-right: 1px solid #333;
            padding-right: 20px;
            margin-right: 10px;
            text-transform: uppercase;
        }

        .gauge-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 110px;
        }

        .gauge-label {
            font-size: 12px;
            font-weight: bold;
            color: #666;
            margin-top: 10px;
            text-transform: uppercase;
            text-align: center;
        }

        #inventory-display {
            font-size: 32px;
            font-weight: bold;
            color: #00ffff;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
        }

        .network-ops-sector {
            border-left: 1px solid #333;
            padding-left: 20px;
            margin-left: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #milestone-text {
            font-size: 18px;
            color: #ff00ff;
            font-family: monospace;
            text-transform: uppercase;
            line-height: 1.1;
            width: 140px;
        }

        #msg {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            display: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.95);
            padding: 30px;
            border: 1px solid #005288;
            z-index: 300;
        }

        #payload-status {
            height: 80px;
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #222;
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            transition: all 0.3s;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="splash">
        <img id="splash-image" src="splashScreen.png" alt="Lunar Launcher">
    </div>

    <div id="msg"></div>

    <div id="telemetry-bar">
        <div class="instructions-box">
            <b>ARROWS:</b> THRUST & ROTATION<br>
            <b>S KEY:</b> STAGE SEPARATION<br>
            <b>D KEY:</b> DEPLOY SATELLITES!<br>
            <b>A KEY:</b> AUTO LAND ENABLE<br>
        </div>
        <div class="gauge-container">
            <div id="inventory-display">50</div>
            <div class="gauge-label">SATS REMAINING</div>
        </div>
        <div class="gauge-container"><canvas id="gauge-hspd" width="80" height="80"></canvas>
            <div class="gauge-label">HORIZONTAL SPD</div>
        </div>
        <div class="gauge-container"><canvas id="gauge-vspd" width="80" height="80"></canvas>
            <div class="gauge-label">VERTICAL SPD</div>
        </div>
        <div class="gauge-container"><canvas id="gauge-alt" width="80" height="80"></canvas>
            <div class="gauge-label">ALTITUDE</div>
        </div>
        <div class="gauge-container">
            <div id="payload-status">READY</div>
            <div class="gauge-label">PAYLOAD ZONE</div>
        </div>
        <div class="gauge-container"><canvas id="gauge-fuel" width="80" height="80"></canvas>
            <div class="gauge-label">PROPELLANT</div>
        </div>
        <div class="gauge-container">
            <div id="timer-box" style="height: 80px; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 16px; color: #00ffff;">
                T+ 00:00</div>
            <div class="gauge-label">MISSION TIME</div>
        </div>
        <div class="gauge-container"><canvas id="gauge-auto" width="80" height="80"></canvas>
            <div class="gauge-label">AUTOLAND [A]</div>
        </div>

        <div class="network-ops-sector">
            <div class="gauge-container">
                <canvas id="gauge-bandwidth" width="80" height="80"></canvas>
                <div class="gauge-label">BANDWIDTH</div>
            </div>
            <div class="gauge-container" style="align-items: flex-start;">
                <div id="constellation-total" style="font-size: 20px; font-weight: bold; color: #ff00ff; height: 30px; font-family: monospace;">
                    SATS: 0</div>
                <div id="milestone-text">OFFLINE</div>
                <div class="gauge-label">NETWORK OPS</div>
            </div>
        </div>
    </div>

    <canvas id="landCanvas"></canvas>

    <script>
        const canvas = document.getElementById('landCanvas');
        const ctx = canvas.getContext('2d');
        const msgBox = document.getElementById('msg');
        const timerBox = document.getElementById('timer-box');
        const payloadHUD = document.getElementById('payload-status');
        const invHUD = document.getElementById('inventory-display');
        const splashDiv = document.getElementById('splash');
        const splashImg = document.getElementById('splash-image');
        const constellationHUD = document.getElementById('constellation-total');
        const milestoneHUD = document.getElementById('milestone-text');

        let width, height;
        const GRAVITY = 15; const THRUST = 44; const MAX_ROT_SPEED = 2.2;
        const ORBITAL_VELOCITY = 45; const VELOCITY_TOLERANCE = 12;
        const TIME_SCALE = 0.75; const LOST_BUFFER = 600; const HUD_HEIGHT = 140;
        let TARGET_ALT_Y; const ALT_ENVELOPE = 45;

        let ship, booster, terrain = [], pads = [], launchPad = {};
        let smokeTrail = [], stars = [], legacySats = [], backgroundObjects = [];
        let craters = [];
        let satellites = [];

        let gameOver = false, separated = false, totalDeployed = 0, doorOpen = false, satInventory = 50;
        let lastTime = performance.now(), missionStart = lastTime;
        // Instruction timer variable
        let instructionsStartTime = null; 
        let animationId = null, pulseAngle = 0, cosmeticObjPulse = 0;
        let splashActive = true; let rotKeyHeldTime = 0; const keys = {};

        let audioCtx = null, engineOsc = null, engineGain = null;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator(); engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth'; engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
            engineGain.gain.setValueAtTime(0, audioCtx.currentTime);
            engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            if (type === 'deploy') {
                o.type = 'triangle'; o.frequency.setValueAtTime(440, now); o.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                g.gain.setValueAtTime(0.05, now); g.gain.linearRampToValueAtTime(0, now + 0.1);
                o.start(); o.stop(now + 0.1);
            } else if (type === 'sep') {
                o.type = 'sawtooth'; o.frequency.setValueAtTime(110, now);
                g.gain.setValueAtTime(0.15, now); g.gain.linearRampToValueAtTime(0, now + 0.2);
                o.start(); o.stop(now + 0.2);
            } else if (type === 'success') {
                [523, 659, 783, 1046].forEach((f, i) => {
                    const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
                    o2.type = 'square'; o2.connect(g2); g2.connect(audioCtx.destination);
                    o2.frequency.setValueAtTime(f, now + i * 0.1); g2.gain.setValueAtTime(0.04, now + i * 0.1);
                    g2.gain.linearRampToValueAtTime(0, now + i * 0.1 + 0.2); o2.start(now + i * 0.1); o2.stop(now + i * 0.1 + 0.2);
                });
            }
        }

        function setEngineVolume(vol) { if (engineGain) engineGain.gain.setTargetAtTime(vol * 0.1, audioCtx.currentTime, 0.05); }

        function playIntroNote(freq, duration) {
            if (!audioCtx) initAudio();
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'square'; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
            o.connect(g); g.connect(audioCtx.destination);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            o.start(); o.stop(audioCtx.currentTime + duration);
        }

        async function triggerSplashScreen() {
            splashActive = true;
            splashDiv.style.opacity = "1";
            setTimeout(() => { if (splashImg) splashImg.style.opacity = "1"; }, 100);
            if (audioCtx) {
                playIntroNote(261.63, 1.0);
                setTimeout(() => playIntroNote(329.63, 1.0), 150);
                setTimeout(() => playIntroNote(392.00, 1.5), 300);
            }
            setTimeout(() => {
                splashDiv.style.opacity = "0"; 
                setTimeout(() => { 
                    splashDiv.style.display = 'none'; 
                    splashActive = false; 
                    missionStart = performance.now(); 
                    // Start the instruction timer when gameplay begins
                    instructionsStartTime = performance.now(); 
                }, 1500);
            }, 4000);
        }

        function init(keepAutopilot = false, isReset = false) {
            if (animationId) cancelAnimationFrame(animationId);
            width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight;
            TARGET_ALT_Y = height * 0.25; gameOver = false; separated = false; totalDeployed = 0; doorOpen = false;
            satInventory = 50;
            if (!isReset) satellites = [];
            // Reset instruction timer on new game/reset
            instructionsStartTime = null; 

            msgBox.style.display = 'none'; const now = performance.now(); lastTime = now; missionStart = now;
            smokeTrail = []; legacySats = []; backgroundObjects = []; rotKeyHeldTime = 0; cosmeticObjPulse = 0;

            generateTerrain(); generateCosmeticObjects();
            const startX = (launchPad.x1 + launchPad.x2) / 2;
            const boosterY = launchPad.y - 25; const shipY = boosterY - 44;

            ship = { id: 'Ship', x: startX, y: shipY, xv: 0, yv: 0, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: keepAutopilot, landed: false, crashed: false, exploded: false, color: '#00a8a8' };
            booster = { id: 'Booster', x: startX, y: boosterY, xv: 0, yv: 0, angle: -Math.PI / 2, fuel: 500, thrusting: false, autopilot: keepAutopilot, landed: false, crashed: false, exploded: false, color: '#b0b0b0', legsVisible: true };

            stars = []; for (let i = 0; i < 150; i++) stars.push({ x: Math.random() * width, y: Math.random() * (height * 0.66), size: Math.random() * 1.5, opacity: Math.random() });
            for (let i = 0; i < 20; i++) legacySats.push({ x: Math.random() * width, y: TARGET_ALT_Y + (Math.random() - 0.5) * (ALT_ENVELOPE * 3), vx: 35 + Math.random() * 25, vy: (Math.random() - 0.5) * 10, size: 3, opacity: 0.2 + Math.random() * 0.3 });

            if (!isReset) triggerSplashScreen(); else { splashDiv.style.display = 'none'; splashActive = false; instructionsStartTime = performance.now(); }
            animationId = requestAnimationFrame(update);
        }

        function generateTerrain() {
            terrain = []; pads = []; const points = 220; const spacing = width / points; const seed = Math.random() * 1000;
            const getTerrainHeight = (x) => {
                const h1 = Math.sin(x * 0.003 + seed) * 60; const h2 = Math.sin(x * 0.01 + seed * 1.5) * 30;
                const h3 = Math.sin(x * 0.025 + seed * 2) * 12; return height - (280 + h1 + h2 + h3);
            };
            const lpStart = 10, lpEnd = 25, lpY = height - 200; launchPad = { x1: lpStart * spacing, x2: lpEnd * spacing, y: lpY };
            const p1Start = Math.floor(points * 0.35); const p2Start = Math.floor(points * 0.75); const padPointWidth = 7;
            for (let i = 0; i <= points; i++) {
                let tx = i * spacing; let ty;
                if (i >= lpStart && i <= lpEnd) ty = lpY;
                else if (i >= p1Start && i <= p1Start + padPointWidth) { ty = getTerrainHeight(p1Start * spacing); if (i === p1Start) pads.push({ x1: tx, x2: tx + (padPointWidth * spacing), y: ty, owner: 'Booster' }); }
                else if (i >= p2Start && i <= p2Start + padPointWidth) { ty = getTerrainHeight(p2Start * spacing); if (i === p2Start) pads.push({ x1: tx, x2: tx + (padPointWidth * spacing), y: ty, owner: 'Ship' }); }
                else ty = getTerrainHeight(tx); terrain.push({ x: tx, y: ty });
            }

            craters = [];
            for (let i = 0; i < 10; i++) {
                const x = Math.random() * width;
                const groundPoint = terrain.find(p => p.x > x) || terrain[terrain.length - 1];
                const groundY = groundPoint.y;
                craters.push({
                    x: x,
                    y: groundY + 15 + Math.random() * 80,
                    radiusX: 10 + Math.random() * 40,
                    radiusY: 4 + Math.random() * 12,
                    alpha: 0.1 + Math.random() * 0.2
                });
            }
        }

        function generateCosmeticObjects() {
            backgroundObjects = [];
            for (let i = 0; i < 2; i++) {
                backgroundObjects.push({
                    type: 'Eagle', x: Math.random() * width, y: height - 400 - Math.random() * 100,
                    size: 0.35, speed: 25 + Math.random() * 15, direction: Math.random() > 0.5 ? 1 : -1,
                    alpha: 0.8, tilt: 0, isGrounded: false
                });
            }
            for (let i = 0; i < 3; i++) {
                backgroundObjects.push({
                    type: 'Buggy', x: (width * 0.1) + Math.random() * (width * 0.8), y: 0,
                    size: 0.6, speed: 6 + Math.random() * 4, direction: Math.random() > 0.5 ? 1 : -1,
                    alpha: 0.8, angle: 0, isGrounded: true
                });
            }
        }

        function deploySatellites() {
            if (gameOver || satInventory <= 0 || splashActive) return;
            playSound('deploy'); doorOpen = true; satInventory -= 10; totalDeployed += 10;
            for (let i = 0; i < 10; i++) satellites.push({ x: ship.x, y: ship.y, vx: ship.xv + (Math.random() - 0.5) * 2, vy: ship.yv + (Math.random() - 0.5) * 2, size: 4, opacity: 1.0, heat: 0, vaporizeAlt: height - (300 + Math.random() * 150) });
        }

        function triggerExplosion(x, y) {
            if (audioCtx) playSound('sep');
            for (let i = 0; i < 20; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160, life: 0.5, size: 2, plasma: true });            
            for (let i = 0; i < 10; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, life: 1.0, size: 5, plasma: true });
            for (let i = 0; i < 3; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 2.0, size: 25, plasma: true });
        }

        function triggerSeparationSmoke(x, y) { for (let i = 0; i < 45; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.5) * 18, life: 0.8, size: 3.5, plasma: false }); }
        function triggerLandingPuff(x, y) { for (let i = 0; i < 35; i++) smokeTrail.push({ x: x, y: y, vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 10 - 5, life: 1.2, size: 4.5, plasma: false, isOrange: true }); }

        function drawGaugeDual(id, val1, val2, max1, max2) {
            const el = document.getElementById(id); if (!el) return;
            const gCtx = el.getContext('2d'); const cx = 40, cy = 40;
            gCtx.clearRect(0, 0, 80, 80); gCtx.strokeStyle = '#1a1a1a'; gCtx.lineWidth = 4;
            gCtx.beginPath(); gCtx.arc(cx, cy, 35, 0, Math.PI * 2); gCtx.stroke(); gCtx.beginPath(); gCtx.arc(cx, cy, 28, 0, Math.PI * 2); gCtx.stroke();
            gCtx.font = 'bold 16px monospace'; gCtx.textAlign = 'center'; gCtx.fillStyle = '#00ffff'; gCtx.fillText(Math.round(val1), cx, cy - 5);
            gCtx.fillStyle = '#ffffff'; gCtx.fillText(Math.round(val2), cx, cy + 13);
            if (id === 'gauge-hspd') { const angle = -Math.PI / 2 + (Math.PI * 2 * (ORBITAL_VELOCITY / max1)); gCtx.strokeStyle = '#ff00ff'; gCtx.lineWidth = 2; gCtx.beginPath(); gCtx.moveTo(cx + 32 * Math.cos(angle), cy + 32 * Math.sin(angle)); gCtx.lineTo(cx + 39 * Math.cos(angle), cy + 39 * Math.sin(angle)); gCtx.stroke(); }
            if (id === 'gauge-alt') { const targetAltVal = pads[0] ? pads[0].y - TARGET_ALT_Y : height; const angle = -Math.PI / 2 + (Math.PI * 2 * (targetAltVal / max1)); gCtx.strokeStyle = '#ffff00'; gCtx.lineWidth = 2; gCtx.beginPath(); gCtx.moveTo(cx + 32 * Math.cos(angle), cy + 32 * Math.sin(angle)); gCtx.lineTo(cx + 39 * Math.cos(angle), cy + 39 * Math.sin(angle)); gCtx.stroke(); }
            gCtx.strokeStyle = '#00ffff'; gCtx.beginPath(); gCtx.arc(cx, cy, 35, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * Math.min(Math.abs(val1) / max1, 1))); gCtx.stroke();
            gCtx.strokeStyle = '#ffffff'; gCtx.beginPath(); gCtx.arc(cx, cy, 28, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * Math.min(Math.abs(val2) / max2, 1))); gCtx.stroke();
        }

        function drawBandwidthGauge(mbps) {
            const el = document.getElementById('gauge-bandwidth'); if (!el) return;
            const gCtx = el.getContext('2d'); const cx = 40, cy = 40;
            gCtx.clearRect(0, 0, 80, 80);
            gCtx.strokeStyle = '#1a1a1a'; gCtx.lineWidth = 6;
            gCtx.beginPath(); gCtx.arc(cx, cy, 32, Math.PI * 0.8, Math.PI * 2.2); gCtx.stroke();
            const pct = Math.min(mbps / 200, 1);
            const grad = gCtx.createLinearGradient(0, 40, 80, 40); grad.addColorStop(0, '#ff00ff'); grad.addColorStop(1, '#00ffff');
            gCtx.strokeStyle = grad; gCtx.beginPath(); gCtx.arc(cx, cy, 32, Math.PI * 0.8, Math.PI * 0.8 + (Math.PI * 1.4 * pct)); gCtx.stroke();
            const needleAngle = Math.PI * 0.8 + (Math.PI * 1.4 * pct);
            gCtx.strokeStyle = '#fff'; gCtx.lineWidth = 2; gCtx.beginPath(); gCtx.moveTo(cx, cy); gCtx.lineTo(cx + Math.cos(needleAngle) * 30, cy + Math.sin(needleAngle) * 30); gCtx.stroke();
            gCtx.font = 'bold 15px monospace'; gCtx.fillStyle = '#ff00ff'; gCtx.textAlign = 'center'; gCtx.fillText(Math.floor(mbps), cx, cy + 12);
            gCtx.font = '12px monospace'; gCtx.fillText("MBPS", cx, cy + 25);
        }

        function runAI(obj, dt) {
            if (splashActive) return; let fuelTarget = (obj === ship && !separated) ? booster : obj;
            if (fuelTarget.fuel <= 0 || obj.landed || obj.crashed) { obj.thrusting = false; return; }
            const myPad = pads.find(p => p.owner === obj.id); if (!myPad) return;
            const dx = ((myPad.x1 + myPad.x2) / 2) - obj.x; const xvError = (dx * 0.26) - (obj.xv * 1.0);
            let targetAngle = -Math.PI / 2 + (xvError * 0.05); targetAngle = Math.max(-Math.PI / 2 - 0.85, Math.min(-Math.PI / 2 + 0.85, targetAngle));
            const angleErr = targetAngle - obj.angle; const rotStep = MAX_ROT_SPEED * dt;
            if (Math.abs(angleErr) < rotStep) obj.angle = targetAngle; else obj.angle += Math.sign(angleErr) * rotStep;
            const targetOffset = (obj.id === 'Booster' && separated) ? 36 : 25; const altitude = myPad.y - (obj.y + targetOffset);
            let targetYv = Math.sqrt(Math.max(0, altitude) * 3.5) + 12; if (targetYv > 45) targetYv = 45;
            if (obj.yv > targetYv) { obj.xv += (Math.cos(obj.angle) * THRUST) * dt; obj.yv += (Math.sin(obj.angle) * THRUST) * dt; if (obj === ship && !separated) booster.fuel -= 50 * dt; else obj.fuel -= 50 * dt; obj.thrusting = true; }
            else obj.thrusting = false;
        }

        function update(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.1) * TIME_SCALE; lastTime = time;
            if (!gameOver && !splashActive) {
                if (ship.autopilot) runAI(ship, dt); if (separated && booster.autopilot) runAI(booster, dt);
                if (!separated && !ship.autopilot) {
                    if (keys['ArrowUp'] && booster.fuel > 0) { ship.xv += (Math.cos(ship.angle) * THRUST) * dt; ship.yv += (Math.sin(ship.angle) * THRUST) * dt; booster.fuel -= 60 * dt; ship.thrusting = true; booster.legsVisible = false; } else ship.thrusting = false;
                    if (keys['ArrowLeft'] || keys['ArrowRight']) { rotKeyHeldTime += dt; const ramp = Math.min(0.2 + (rotKeyHeldTime / (0.4 * TIME_SCALE)) * 0.8, 1.0); const dir = keys['ArrowLeft'] ? -1 : 1; ship.angle += dir * MAX_ROT_SPEED * ramp * dt; } else rotKeyHeldTime = 0;
                } else if (separated && !ship.autopilot) {
                    if (keys['ArrowUp'] && ship.fuel > 0) { ship.xv += (Math.cos(ship.angle) * THRUST) * dt; ship.yv += (Math.sin(ship.angle) * THRUST) * dt; ship.fuel -= 60 * dt; ship.thrusting = true; } else ship.thrusting = false;
                    if (keys['ArrowLeft'] || keys['ArrowRight']) { rotKeyHeldTime += dt; const ramp = Math.min(0.2 + (rotKeyHeldTime / (0.4 * TIME_SCALE)) * 0.8, 1.0); const dir = keys['ArrowLeft'] ? -1 : 1; ship.angle += dir * MAX_ROT_SPEED * ramp * dt; } else rotKeyHeldTime = 0;
                }
                if (!separated) {
                    ship.yv += GRAVITY * dt; ship.x += ship.xv * dt; ship.y += ship.yv * dt; booster.angle = ship.angle; booster.xv = ship.xv; booster.yv = ship.yv; booster.x = ship.x + Math.cos(ship.angle + Math.PI) * 44; booster.y = ship.y + Math.sin(ship.angle + Math.PI) * 44;
                    checkColl(booster); if (booster.crashed) ship.crashed = true;
                    if (booster.yv === 0) { ship.yv = 0; ship.xv = booster.xv; ship.x = booster.x - Math.cos(booster.angle + Math.PI) * 44; ship.y = booster.y - Math.sin(booster.angle + Math.PI) * 44; if (booster.landed) ship.landed = true; }
                } else {
                    if (!ship.landed && !ship.crashed) { ship.yv += GRAVITY * dt; ship.x += ship.xv * dt; ship.y += ship.yv * dt; checkColl(ship); }
                    if (!booster.landed && !booster.crashed) { booster.yv += GRAVITY * dt; booster.x += booster.xv * dt; booster.y += booster.yv * dt; checkColl(booster); }
                }

                if (!ship.thrusting && !separated && Math.abs(ship.yv) < 0.1 && Math.random() > 0.9) {
                    smokeTrail.push({
                        x: ship.x + 7, y: ship.y + 18,
                        vx: 3 + Math.random() * 3, vy: -0.5 + Math.random(),
                        life: 0.8, size: 1.0, plasma: false, isOrange: false
                    });
                }

                [ship, booster].forEach(obj => { if (obj.crashed && !obj.exploded) { triggerExplosion(obj.x, obj.y); obj.exploded = true; } });
                if ((separated && (ship.landed || ship.crashed) && (booster.landed || booster.crashed)) || (!separated && (ship.landed || ship.crashed))) {
                    gameOver = true; const landSuccess = ship.landed && (separated ? booster.landed : true);
                    const win = landSuccess && totalDeployed > 0;
                    if (win) { msgBox.innerHTML = `MISSION SUCCESS<br><span style='font-size:16px; color:#fff;'>RECOVERY COMPLETE</span>`; playSound('success'); } else { msgBox.innerHTML = "MISSION FAILURE"; }
                    msgBox.style.color = win ? "#0f0" : "#f00"; msgBox.style.display = "block"; setTimeout(() => init(false, true), 5500);
                }
            }

            if (!splashActive) {
                [ship, booster].forEach(obj => {
                    if ((obj.landed || obj.yv === 0) && !obj.crashed && !obj.exploded) {
                        const targetAngle = -Math.PI / 2;
                        let angleDiff = targetAngle - obj.angle;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        if (Math.abs(angleDiff) > 0.001) obj.angle += angleDiff * 4.5 * dt;
                        else obj.angle = targetAngle;
                    }
                });
            }

            if (audioCtx) { const anyThrusting = ship.thrusting || (separated && booster.thrusting); const bothLanded = separated ? (ship.landed && booster.landed) : ship.landed; setEngineVolume((anyThrusting && !bothLanded && !gameOver) ? 1.0 : 0); }

            if (!splashActive) {
                backgroundObjects.forEach(obj => {
                    obj.x += obj.speed * obj.direction * dt;
                    if (obj.isGrounded) {
                        const p1 = terrain.find(p => p.x > obj.x);
                        if (p1) {
                            const pIndex = terrain.indexOf(p1);
                            const p0 = terrain[pIndex - 1] || terrain[0];
                            const pct = (obj.x - p0.x) / (p1.x - p0.x);
                            obj.y = p0.y + (p1.y - p0.y) * pct - 5;
                            obj.angle = Math.atan2(p1.y - p0.y, p1.x - p0.x);
                        }
                    }
                    if (obj.x < 0) obj.direction = 1; if (obj.x > width) obj.direction = -1;
                    if (obj.type === 'Eagle' && Math.random() > 0.8) {
                        const engineX = obj.x + (70 * obj.size * (obj.direction * -1));
                        smokeTrail.push({
                            x: engineX, y: obj.y,
                            vx: (Math.random() - 0.5) * 2 - (obj.direction * 2),
                            vy: (Math.random() - 0.5) * 2,
                            life: 0.3, size: 1.2, plasma: false, isOrange: false
                        });
                    }
                });
                cosmeticObjPulse += 0.05;
            }

            legacySats.forEach((s) => { const altDiff = TARGET_ALT_Y - s.y; if (Math.abs(altDiff) < 150) s.vy += altDiff * 0.01 * dt; s.x += s.vx * dt; s.y += s.vy * dt; if (s.x > width + 50) s.x = -50; });

            for (let i = satellites.length - 1; i >= 0; i--) {
                const s = satellites[i];
                const altDiff = TARGET_ALT_Y - s.y;
                if (Math.abs(altDiff) < 200) s.vy += (altDiff * 0.005 - s.vy * 0.125) * dt;
                if (s.y > TARGET_ALT_Y + ALT_ENVELOPE) { s.vy += 12 * dt; s.heat += 0.5 * dt; }
                s.vx += (Math.random() - 0.5) * 2.0 * dt;
                s.x += s.vx * dt; s.y += s.vy * dt;
                if (s.y > s.vaporizeAlt) {
                    for (let j = 0; j < 10; j++) {
                        smokeTrail.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15, life: 0.5, size: 2, plasma: true });
                    }
                    satellites.splice(i, 1);
                    continue;
                }
                if (s.x > width + 100) s.x = -100; else if (s.x < -100) s.x = width + 100;
                if (s.y < -500) satellites.splice(i, 1);
            }

            [ship, booster].forEach(obj => { if (obj.exploded) return; const activeThrust = !separated ? (obj === booster && ship.thrusting) : obj.thrusting; const yOff = (obj === booster) ? 36 : 30; if (activeThrust && !obj.landed && Math.random() > 0.2) smokeTrail.push({ x: obj.x + Math.cos(obj.angle + Math.PI) * yOff, y: obj.y + Math.sin(obj.angle + Math.PI) * yOff, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 1, size: 2.5 }); });
            smokeTrail.forEach((p, i) => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= (p.plasma ? 0.4 : (p.isOrange ? 0.5 : 0.1)) * dt; p.size += (p.plasma ? 3.0 : 5) * dt; if (p.life <= 0) smokeTrail.splice(i, 1); });
            updateUI(time); draw(); animationId = requestAnimationFrame(update);
        }

        function checkColl(obj) {
            if (obj.landed || obj.crashed) return;
            if (obj.x >= launchPad.x1 && obj.x <= launchPad.x2 && obj.y + 25 >= launchPad.y) { obj.y = launchPad.y - 25; obj.yv = 0; obj.xv *= 0.8; return; }
            for (let i = 0; i < terrain.length - 1; i++) {
                let p1 = terrain[i], p2 = terrain[i + 1];
                if (obj.x >= p1.x && obj.x <= p2.x) {
                    let groundY = p1.y + (p2.y - p1.y) * ((obj.x - p1.x) / (p2.x - p1.x)); const landingThreshold = (obj.id === 'Booster' && separated) ? groundY - 15 : groundY;
                    if (obj.y + 25 >= landingThreshold) {
                        const pad = pads.find(p => obj.x >= p.x1 && obj.x <= p.x2 && (p.owner === obj.id || !separated));
                        const vLimit = separated ? 35 : 15; if (pad && obj.yv < vLimit && Math.abs(obj.xv) < 20 && Math.abs(obj.angle + Math.PI / 2) < 0.25) { obj.landed = true; obj.xv = 0; obj.yv = 0; obj.thrusting = false; triggerLandingPuff(obj.x, obj.y + 25); }
                        else obj.crashed = true;
                    }
                }
            }
        }

        function updateUI(time) {
            const elapsed = Math.floor((time - missionStart) / 1000); timerBox.innerText = splashActive ? "T- 00:00" : `T+ ${Math.floor(elapsed / 60).toString().padStart(2, '0')}:${(elapsed % 60).toString().padStart(2, '0')}`;
            invHUD.innerText = satInventory; drawGaugeDual('gauge-hspd', ship.xv, booster.xv, 80, 80); drawGaugeDual('gauge-vspd', ship.yv, booster.yv, 60, 60);
            const padS = pads.find(p => p.owner === 'Ship') || { y: height }; const padB = pads.find(p => p.owner === 'Booster') || { y: height };
            drawGaugeDual('gauge-alt', padS.y - (ship.y + 25), padB.y - (booster.y + 25), height, height);
            drawGaugeDual('gauge-fuel', ship.fuel, booster.fuel, 500, 500);
            const finalInZone = Math.abs(ship.y - TARGET_ALT_Y) < ALT_ENVELOPE && Math.abs(ship.xv - ORBITAL_VELOCITY) < VELOCITY_TOLERANCE;
            payloadHUD.innerText = finalInZone ? "IN ZONE" : "OUTSIDE"; payloadHUD.style.borderColor = finalInZone ? "#0f0" : "#444"; payloadHUD.style.color = finalInZone ? "#0f0" : "#666";
            const count = satellites.filter(s => Math.abs(s.y - TARGET_ALT_Y) < ALT_ENVELOPE).length;
            const mbps = count * 0.95; constellationHUD.innerText = `SATS: ${count}`;
            let milestone = "OFFLINE: NO CONSTELLATION";
            if (count > 0 && count < 10) milestone = "BBS REACHED: 14.4K DIAL-UP";
            else if (count < 30) milestone = "AOL 2.5 ACHIEVED: WELCOME!";
            else if (count < 60) milestone = "NETSCAPE NAVIGATOR: THE WEB IS BORN";
            else if (count < 100) milestone = "NAPSTER PEER-2-PEER: SHARING FILE";
            else if (count < 150) milestone = "GEOCITIES LIVE: MY HOME PAGE";
            else if (count < 200) milestone = "HAMSTER DANCE 4K: DANCE NOW";
            else if (count >= 200) milestone = "MODERN WEB: UNSTABLE (LAGGY)";
            milestoneHUD.innerText = milestone;
            drawBandwidthGauge(mbps);
            const gAutoEl = document.getElementById('gauge-auto');
            if (gAutoEl) {
                const gAuto = gAutoEl.getContext('2d'); gAuto.clearRect(0, 0, 80, 80); const active = ship.autopilot; gAuto.strokeStyle = active ? '#0f0' : '#333'; gAuto.lineWidth = 4; gAuto.beginPath(); gAuto.arc(40, 40, 35, 0, Math.PI * 2); gAuto.stroke(); gAuto.fillStyle = active ? `rgba(0, 255, 0, ${0.3 + Math.sin(pulseAngle) * 0.2})` : '#111'; gAuto.beginPath(); gAuto.arc(40, 40, 15, 0, Math.PI * 2); gAuto.fill(); gAuto.fillStyle = '#fff'; gAuto.font = '10px Arial'; gAuto.textAlign = 'center'; gAuto.textBaseline = 'middle'; gAuto.fillText(active ? "AUTO" : "MANUAL", 40, 40); pulseAngle += 0.1;
            }
        }

        function drawCosmeticEagle(obj, alpha) {
            ctx.save(); ctx.translate(obj.x, obj.y);
            ctx.scale(obj.size * (obj.direction * -1), obj.size);
            ctx.fillStyle = `rgba(130,130,130, ${alpha})`; ctx.strokeStyle = `rgba(0,0,0, ${alpha})`; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-100, 0); ctx.lineTo(-80, -20); ctx.lineTo(-70, -20); ctx.lineTo(-60, -10); ctx.lineTo(-60, 10); ctx.lineTo(-70, 20); ctx.lineTo(-80, 20); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = `rgba(140,140,140, ${alpha})`; ctx.fillRect(-60, -20, 120, 40); ctx.strokeRect(-60, -20, 120, 40);
            ctx.fillStyle = `rgba(50,50,60, ${alpha})`;
            for (let i = 0; i < 5; i++) { ctx.fillRect(-48 + (i * 22), -5, 10, 10); }
            ctx.strokeStyle = `rgba(80,80,80, ${alpha})`; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(-60, -25); ctx.lineTo(60, -25); ctx.stroke();
            for (let i = -50; i <= 50; i += 25) { ctx.beginPath(); ctx.moveTo(i, -25); ctx.lineTo(i, -20); ctx.stroke(); }
            ctx.fillStyle = `rgba(130, 80, 40, ${alpha})`;
            ctx.beginPath(); ctx.moveTo(60, -10); ctx.lineTo(80, -15); ctx.lineTo(80, 15); ctx.lineTo(60, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = `rgba(110,110,110, ${alpha})`; ctx.lineWidth = 1.5;
            const legOffsets = [-52, -38, 38, 52];
            legOffsets.forEach(offset => {
                ctx.beginPath(); ctx.moveTo(offset, 20); ctx.lineTo(offset + (offset < 0 ? -6 : 6), 36); ctx.stroke();
                ctx.fillStyle = `rgba(80,80,80, ${alpha})`; ctx.fillRect(offset + (offset < 0 ? -12 : 0), 36, 12, 3);
            });
            ctx.restore();
        }

        function drawCosmeticBuggy(obj, alpha) {
            ctx.save(); ctx.translate(obj.x, obj.y); ctx.rotate(obj.angle); ctx.scale(obj.size, obj.size);
            ctx.fillStyle = `rgba(220,220,220, ${alpha})`; ctx.strokeStyle = `rgba(50,50,50, ${alpha})`; ctx.lineWidth = 1;
            ctx.fillRect(-12, -8, 24, 8); ctx.beginPath(); ctx.moveTo(5, -8); ctx.lineTo(8, -15); ctx.stroke();
            ctx.fillStyle = `rgba(20,20,20, ${alpha})`; ctx.beginPath(); ctx.arc(-8, 2, 4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(8, 2, 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawRocket(obj, type) {
            if (obj.exploded) return;
            ctx.save(); ctx.translate(obj.x, obj.y); ctx.rotate(obj.angle + Math.PI / 2);
            ctx.fillStyle = obj.color; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
            if (type === 'ship') {
                ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(7.2, -10); ctx.lineTo(8.1, 20); ctx.lineTo(-8.1, 20); ctx.lineTo(-7.2, -10); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.moveTo(-7.7, -10); ctx.lineTo(7.7, -10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-8.1, 10); ctx.lineTo(8.1, 10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(3.6, -10); ctx.lineTo(3.6, 20); ctx.stroke();
                ctx.fillStyle = (doorOpen && satInventory > 0) ? '#004d4d' : '#007a7a'; ctx.fillRect(-4.5, 5, 9, 4); ctx.strokeRect(-4.5, 5, 9, 4);
            } else {
                ctx.fillRect(-8.1, -24, 16.2, 48); ctx.strokeRect(-8.1, -24, 16.2, 48);
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-3, -18); ctx.lineTo(3, -18); ctx.stroke();
                ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-8.1, -12); ctx.lineTo(8.1, -12); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-8.1, 6); ctx.lineTo(8.1, 6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-3.6, -24); ctx.lineTo(-3.6, 24); ctx.stroke();
            }
            if (type === 'ship' || obj.legsVisible) {
                ctx.strokeStyle = obj.color; ctx.beginPath();
                const yBase = (type === 'booster') ? 18 : 15;
                ctx.moveTo(-8.1, yBase); ctx.lineTo(-14.4, yBase + 10); ctx.lineTo(-18.9, yBase + 10);
                ctx.moveTo(8.1, yBase); ctx.lineTo(14.4, yBase + 10); ctx.lineTo(18.9, yBase + 10);
                ctx.stroke();
            }
            const active = !separated ? (obj === booster && ship.thrusting) : obj.thrusting;
            const currentFuel = (!separated && obj === booster) ? booster.fuel : obj.fuel;
            if (active && (currentFuel > 0 || !separated) && !obj.landed) {
                const grad = ctx.createLinearGradient(0, 20, 0, 60); grad.addColorStop(0, '#ffcc00'); grad.addColorStop(0.5, '#ff6600'); grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad; ctx.beginPath(); const yStart = (type === 'booster') ? 24 : 20;
                ctx.moveTo(-5.4, yStart); ctx.quadraticCurveTo(0, yStart + 40, 5.4, yStart); ctx.fill();
            }
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, width, height);
            stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${s.opacity})`; ctx.fillRect(s.x, s.y, s.size, s.size); });
            ctx.save(); ctx.setLineDash([10, 10]); ctx.strokeStyle = 'rgba(100, 100, 100, 0.4)'; ctx.beginPath(); ctx.moveTo(0, TARGET_ALT_Y - ALT_ENVELOPE); ctx.lineTo(width, TARGET_ALT_Y - ALT_ENVELOPE); ctx.moveTo(0, TARGET_ALT_Y + ALT_ENVELOPE); ctx.lineTo(width, TARGET_ALT_Y + ALT_ENVELOPE); ctx.stroke(); ctx.restore();
            backgroundObjects.forEach(obj => { if (obj.type === 'Eagle') drawCosmeticEagle(obj, obj.alpha); else if (obj.type === 'Buggy') drawCosmeticBuggy(obj, obj.alpha); });
            
            // --- DRAW STARTUP INSTRUCTIONS ---
            const now = performance.now();
            if (instructionsStartTime && (now - instructionsStartTime) < 5000) {
                ctx.save();
                ctx.font = 'bold 40px Segoe UI, Arial, sans-serif'; // "fairly large"
                ctx.fillStyle = 'rgba(0, 255, 255, 0.7)'; // Cyan matching HUD, slightly faded
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Render text centered within the acceptable altitude band
                ctx.fillText('Deploy Satellites Into Orbit', width / 2, TARGET_ALT_Y);
                ctx.restore();
            }
            
            smokeTrail.forEach(p => { let color; if (p.plasma) color = `rgba(255, ${Math.random() * 150 + 100}, 0, ${p.life * 0.8})`; else if (p.isOrange) color = `rgba(255, 140, 0, ${p.life * 0.6})`; else color = `rgba(140,140,140,${p.life * 0.3})`; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); });
            ctx.strokeStyle = '#555'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(launchPad.x1, launchPad.y); ctx.lineTo(launchPad.x2, launchPad.y); ctx.stroke();
            pads.forEach(p => {
                ctx.strokeStyle = p.owner === 'Ship' ? '#00ffff' : '#ffffff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(p.x1, p.y); ctx.lineTo(p.x2, p.y); ctx.stroke();
                if (p.owner === 'Booster') {
                    let centerX = (p.x1 + p.x2) / 2; ctx.strokeStyle = '#303030'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(centerX + 15, p.y); ctx.lineTo(centerX + 15, p.y - 80); ctx.stroke();
                    ctx.strokeStyle = '#303030'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(centerX + 20, p.y); ctx.lineTo(centerX + 20, p.y - 80); ctx.stroke();
                    ctx.strokeStyle = '#404040'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(centerX + 15, p.y - 59); ctx.lineTo(centerX - 9, p.y - 59); ctx.stroke();
                }
            });
            craters.forEach(c => { ctx.strokeStyle = `rgba(120, 120, 120, ${c.alpha})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(c.x, c.y, c.radiusX, c.radiusY, 0, 0, Math.PI * 2); ctx.stroke(); });
            ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(terrain[0] ? terrain[0].x : 0, terrain[0] ? terrain[0].y : height); terrain.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            drawRocket(ship, 'ship'); drawRocket(booster, 'booster');
            legacySats.forEach(s => { ctx.fillStyle = `rgba(180, 240, 255, ${s.opacity})`; ctx.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size); });
            satellites.forEach(s => {
                const heatRatio = Math.min(s.heat / 5, 1); const r = Math.floor(200 + (55 * heatRatio)), g = Math.floor(255 * (1 - heatRatio)), b = Math.floor(255 * (1 - heatRatio));
                const streakLen = 0.1 + (heatRatio * 0.8); ctx.save(); const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * streakLen, s.y - s.vy * streakLen); grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${s.opacity})`); grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`); ctx.strokeStyle = grad; ctx.lineWidth = 1 + (heatRatio * 1); ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * streakLen, s.y - s.vy * streakLen); ctx.stroke(); ctx.restore(); ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${s.opacity})`; ctx.fillRect(s.x - s.size / 2, s.y - s.size / 2, s.size, s.size);
            });
        }

        window.addEventListener('keydown', e => { if (!audioCtx) initAudio(); if (splashActive) return; keys[e.code] = true; if (e.code === 'KeyS' && !separated) { const midX = (ship.x + booster.x) / 2; const midY = (ship.y + booster.y) / 2; triggerSeparationSmoke(midX, midY); playSound('sep'); separated = true; booster.autopilot = true; booster.yv += 22; ship.yv -= 10; } if (e.code === 'KeyD') deploySatellites(); if (e.code === 'KeyA') { ship.autopilot = !ship.autopilot; playSound('beep'); } if (e.code === 'Space' && gameOver) init(false, true); });
        window.addEventListener('keyup', e => keys[e.code] = false); window.addEventListener('mousedown', () => { if (!audioCtx) initAudio(); });
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; TARGET_ALT_Y = height * 0.25; });
        init(false);
    </script>
